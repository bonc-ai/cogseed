image: node:24-bookworm

stages:
  - verify
  - compliance

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

verify:
  stage: verify
  script:
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run readme:check
    - npm run builtin:manifest:check

# Open-source compliance gates. SBOM freshness may need network access, so
# this job runs on the default branch or can be started manually elsewhere.
compliance:
  stage: compliance
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
  script:
    - npm run reuse:check
    - npm run builtin:manifest:check
    - npm run sbom:check

name: 体验反馈 / Experience feedback
description: 安装或使用 CogSeed 时遇到的问题、Bug 或改进建议
title: "[体验反馈] "
labels:
  - user feedback
body:
  - type: markdown
    attributes:
      value: |
        感谢试用 CogSeed！请尽量写清操作步骤，方便我们复现。
        能复现的 Bug 和被采纳的改进建议会记为“有效反馈”。功能许愿请使用 Feature request 模板。
        **请勿粘贴账号、API Key、手机号、本机路径等个人信息。**
  - type: dropdown
    id: feedback_type
    attributes:
      label: 反馈类型
      options:
        - 安装或启动问题
        - 使用中的 Bug
        - 体验改进建议
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 客户端版本
      description: 在“设置 → 关于”中查看
      placeholder: 例如 1.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS（Apple 芯片）
        - Windows
        - 其他（请在补充说明中注明）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 发生在哪个环节
      options:
        - 安装与启动
        - 登录与模型配置
        - 会话与任务
        - Agent
        - Skill
        - 知识库
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 从打开客户端开始，按顺序写下你做了什么
      placeholder: |
        1. 打开客户端，进入……
        2. 点击……
        3. 输入……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么；有报错请贴出报错文字
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你原本期望看到什么
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都出现
        - 偶尔出现
        - 只出现过一次
        - 不适用（改进建议）
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 截图或补充说明
      description: 可直接拖入截图或录屏；请先遮挡个人信息
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复反馈。
          required: true
        - label: 我已去除账号、API Key、本机路径等个人信息。
          required: true

name: Develop Nightly

# L2 每日全量 —— 兜住 L1 的漏网，翻出"攒着没人发现"的红单。
#
# 【为什么不用 schedule 触发 —— 重要】
#   GitHub 的 schedule 事件**只在仓库默认分支上运行**。
#   本仓库默认分支是 main，而 main 是"发版镜像"（只从 cicd 同步过来、零夹带），
#   把 develop 的工具放到 main 上会破坏这个约定。
#   所以这里改用 push 触发 + 每日一次门控：
#     - push 事件读的是**被 push 分支上的 workflow 文件**，develop 上可以生效；
#     - 门控步骤检查"今天是否已经跑过"，跑过就跳过，保证每天最多一次。
#   净效果 = 每天在 develop 的第一次提交上跑一次全量。
#
#   代价（可接受）：当天更晚合入的代码，要等第二天那一次才能覆盖到。
#   如果觉得不够及时，把下面门控的"今天"改成"最近 12 小时"即可变成一天两次。
#
# 【为什么必须有这一层】
#   L1（develop-gate.yml）只跑「受影响的测试」，靠模块图传播筛选，必然有漏网。
#   1.1.2 实证：macOS 全量套件约 7.2 分钟，整个 job 约 9 分钟。
#   而且 develop 上确实存在 L1 抓不到的红单——PR #277 报告
#   context-projection-confirm-wake.test.ts 2 个用例在干净 develop 上同样失败，
#   因为这个文件本身没被改过、是被测源码变了（语义冲突）。
#
# 【红了怎么办】
#   本层不阻塞任何合并。但红了必须当天修，否则又变成 1.1.2 那种"攒着没人管"。
#   建议：SM 每天早会固定过一眼本 workflow 的结果。

on:
  push:
    branches:
      - develop
  # 保留手动触发：想立刻验证时不必等下一次 push
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # 门控步骤要读本 workflow 的历史运行记录

jobs:
  full-suite:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 每日一次门控（今天已跑过就跳过）
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 手动触发时不做门控，随点随跑
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "手动触发，跳出门控"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          # 只数已完成（completed）的运行，避免把本次自己算进去
          N=$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow=develop-nightly.yml \
                --created "$TODAY" \
                --status completed \
                --limit 20 \
                --json databaseId -q 'length' 2>/dev/null || echo 0)
          N=${N:-0}
          echo "今天（UTC $TODAY）已完成的运行次数：$N"
          if [ "$N" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已经跑过全量，本次跳过。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - if: steps.gate.outputs.skip == 'false'
        run: npm run test:resources:setup
      - if: steps.gate.outputs.skip == 'false'
        run: npm run typecheck
      - if: steps.gate.outputs.skip == 'false'
        run: npm run lint

      # 与 ci.yml 的 verify 保持一致：限 2 个 worker。
      # macos-latest 是 3 vCPU，默认 4 worker 会过度抢占，导致负载型时序用例
      # （CLI 版本探测、boot 恢复投影等）偶发超时红单。
      - name: Full JS suite
        if: steps.gate.outputs.skip == 'false'
        run: node scripts/run-tests.mjs run --maxWorkers=2

      - if: steps.gate.outputs.skip == 'false'
        run: npm run test:resources
      - if: steps.gate.outputs.skip == 'false'
        run: npm run readme:check
      - if: steps.gate.outputs.skip == 'false'
        run: npm run tokens:check
      - if: steps.gate.outputs.skip == 'false'
        run: npm run builtin:manifest:check

      - name: Skip 残留检查（防 it.skip 静音）
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # ci.yml 只在 cicd 上跑，所以 develop 侧必须自己盯这一条。
          # 1.1.2 的同步分支 2bc6bb9c 曾一次静音 231 个失败。
          n=$(git grep -nE '\b(it|test|describe)\.skip\s*\(' -- test/ | wc -l | tr -d ' ')
          echo "develop 上 it.skip / describe.skip 命中数：$n"
          if [ "$n" -gt 0 ]; then
            echo "::warning::develop 上存在 $n 处 skip。请确认每一处都有正当理由并在 PR 里留痕。"
            git grep -nE '\b(it|test|describe)\.skip\s*\(' -- test/
          fi

      - name: 测试用例数快照（覆盖度趋势）
        if: always() && steps.gate.outputs.skip == 'false'
        run: |
          set -euo pipefail
          echo "=== 关键文件的用例数（用于对比覆盖度是否又掉了）==="
          for f in \
            test/renderer/recall-cognition-flow.test.ts \
            test/renderer/cognition-chain-view.test.ts \
            test/renderer/skills-cognition-layout.test.ts \
            test/renderer/skills-frontmatter.test.ts \
            test/renderer/recall-source-display.test.ts \
            test/renderer/recall-candidate-capability-ui.test.ts \
            test/renderer/recall-candidate-decision-flow.test.ts \
            test/renderer/ui-components.test.ts \
            test/renderer/shared-ui-adoption-guard.test.ts ; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              printf '%-58s %s\n' "$f" "$(git show HEAD:$f | grep -cE '\b(it|test)\s*\(' || echo 0)"
            fi
          done
          echo ""
          echo "对照基线（1.1.2 修复前 f79719c7）："
          echo "  recall-cognition-flow 115 / cognition-chain-view 21 / skills-cognition-layout 27"
          echo "  skills-frontmatter 17 / recall-source-display 8 / recall-candidate-capability-ui 23"
          echo "  recall-candidate-decision-flow 11 / shared-ui-adoption-guard 1"

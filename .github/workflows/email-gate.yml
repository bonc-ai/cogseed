# Email hygiene gate — blocks PRs whose commits carry personal email addresses.
#
# Personal emails (gmail / qq / 163 / corporate-personal / *.local) must never
# enter public commit history. Every commit in a PR must use a noreply address:
#   {GitHubUserID}+{username}@users.noreply.github.com
# or a sanctioned team address (see the allowlist below).
#
# This gate is fast (<5s): it inspects commit author emails **and** any email
# appearing in the commit message / Co-authored-by trailers, no build.
# It runs on every PR targeting develop (and is also wired into cicd's verify).
#
# TEMPORARY EXCEPTION (recorded 2026-09-20) — 184377817@qq.com, **author emails only**:
#   Source: the GitHub web-UI merge commit `2f5a490e` ("Merge pull request #288"),
#   whose author email is taken from the account that clicked merge. A PR author
#   can neither control nor amend that address, and it is already part of the
#   public history (rewriting develop is not an option). It is the only
#   non-allowlisted author email across all **merged** history (develop / main /
#   cicd); unmerged side branches and some tags still carry personal addresses,
#   but those never enter this gate's range.
#   Scope: applies to the author check only. The message / Co-authored-by scan
#   below still covers **every** commit, merges included.
#
#   ⚠️ DELETE THIS ENTRY once the cicd branch contains `2f5a490e`. From that point
#   the commit is an ancestor of both check ranges (`base..head` on PRs and
#   `origin/cicd..HEAD` in ci.yml), so the address is no longer needed here — and
#   leaving it in place would permanently allowlist this account's webpage merges,
#   which is exactly the scenario CONTRIBUTING.md → "Merge requirements" item 4
#   exists to prevent.
#   Root cause + prevention: mergers must enable "Keep my email addresses private".
#
# TEMPORARY EXCEPTION (recorded 2026-09-23) — fzywind@gmail.com, **author emails only**:
#   Source: the squash-merge commit `a0cb7c5f` ("feat(community): add contribution
#   entry points (#369)"), authored by an account that has not enabled
#   "Keep my email addresses private". That commit's own Signed-off-by and
#   Co-authored-by trailers already use the noreply form — only the author header
#   carries the personal address. It is already public on `develop` and cannot be
#   amended without rewriting `develop`, which the `develop-approval-gate` ruleset
#   forbids (the ruleset has no bypass actors).
#   Scope: author check only — identical to the entry above.
#
#   ⚠️ DELETE THIS ENTRY once the cicd branch contains `a0cb7c5f`, i.e. immediately
#   after the next develop → cicd promotion merges. From that point the commit is an
#   ancestor of both check ranges (`base..head` on PRs and `origin/cicd..HEAD` in
#   ci.yml), so leaving the entry in place would keep allowlisting this account for
#   no reason.
#   Root cause + prevention: contributors must enable "Keep my email addresses private".

name: email-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-commit-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check author emails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Author allowlist: GitHub noreply + team address + the two historical
          # author-header exceptions documented in the file header.
          bad=$(git log --format='%h|%an|%ae' "$BASE_SHA..$HEAD_SHA" 2>/dev/null \
            | grep -vE '\|([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn|184377817@qq\.com|fzywind@gmail\.com)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::PR contains commits with non-noreply author emails:"
            echo "$bad"
            echo ""
            echo "Fix: set git config user.email to {GitHubUserID}+{username}@users.noreply.github.com"
            echo "  e.g. git config --global user.email {GitHubUserID}+{username}@users.noreply.github.com"
            echo "  then amend/rebase the offending commits."
            exit 1
          fi
          echo "✅ All commit author emails are noreply."
      - name: Check co-author and message emails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Co-authored-by trailers and free-text bodies are part of the public
          # commit record too (see #184: a personal QQ address slipped in via a
          # Co-authored-by line while every author email was noreply).
          # Allowlist = noreply github addresses, the team address, and GitHub's
          # own automation address.
          bad=$(git log --format='%h|%B' "$BASE_SHA..$HEAD_SHA" 2>/dev/null \
            | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            | grep -viE '^([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn|support@github\.com)$' \
            | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit messages / Co-authored-by contain non-allowlisted emails:"
            echo "$bad"
            echo ""
            echo "Allowed: {GitHubUserID}+{username}@users.noreply.github.com, business@bonc.com.cn, support@github.com"
            echo "Personal addresses (*.local / qq / 163 / gmail) must not appear anywhere in a commit."
            exit 1
          fi
          echo "✅ Commit messages and Co-authored-by trailers are clean."

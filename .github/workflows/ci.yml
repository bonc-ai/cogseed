name: CI

# CI (verify + verify-windows) runs only on the cicd branch — the release gate.
# Day-to-day development merges into develop via review only (no CI);
# the full macOS and Windows verification runs once when a PR targets cicd,
# and again on push to cicd, right before tagging a release.
on:
  pull_request:
    branches:
      - cicd
  push:
    branches:
      - cicd

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:resources:setup
      - run: npm run typecheck
      - run: npm run lint
      # 全量套件默认 maxWorkers=4，在 macos-latest（3 vCPU）上会过度抢占，
      # 负载型时序用例（CLI 版本探测、boot 恢复投影等）因此偶发超时红单。
      # 发布门禁优先稳定性：限制 2 个 worker，多花几分钟换可重复的绿。
      - run: node scripts/run-tests.mjs run --maxWorkers=2
      - run: npm run test:resources
      - run: npm run readme:check
      - run: npm run tokens:check
      - run: npm run builtin:manifest:check
      - name: Email hygiene gate (release gate)
        if: github.event_name == 'push' || github.base_ref == 'cicd'
        run: |
          set -euo pipefail
          bad=$(git log --format='%h|%an|%ae' "origin/cicd..HEAD" 2>/dev/null \
            | grep -vE '\|([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits to cicd contain non-noreply author emails:"
            echo "$bad"
            exit 1
          fi
          echo "✅ All commit author emails are noreply."

  verify-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:resources:setup
      - run: npm run lint
      - name: P3394 Windows compatibility gate
        run: npm run test:p3394:windows
      - run: npm run test:resources
      - run: npm run test:platform-native
      - name: P3394 gateway protocol smoke
        run: node p3394-gateway/test/smoke.cjs

  # Full JS suite split into four serial shards on separate runners. Each shard
  # keeps --maxWorkers=1 (Windows process/timing stability) while the shards
  # themselves run in parallel.
  verify-windows-shard:
    name: verify-windows-shard-${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline
      - run: node scripts/run-tests.mjs run --maxWorkers=1 --shard=${{ matrix.shard }}/4

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:win
      # Known Windows packaged-STT gap: the smoke does not produce its marker
      # on the hosted runner yet. Keep it visible with the app's captured
      # stdout/stderr, but do not let this single app-level smoke block the
      # Windows build/sign/artifact gate while it is tracked separately.
      - name: Packaged STT smoke (informational)
        continue-on-error: true
        run: npm run verify:package:stt:win
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: cogseed-windows-x64-${{ github.sha }}
          path: dist/CogSeed-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14

  # Aggregate keeps the release-gate job name stable while failing closed if
  # any Windows lane fails. `if: always()` is required so a failed dependency
  # produces an explicit failure instead of a skipped job.
  verify-windows:
    needs: [verify-windows-native, verify-windows-shard, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows lane
        run: |
          set -euo pipefail
          echo "native=${{ needs.verify-windows-native.result }}"
          echo "shards=${{ needs.verify-windows-shard.result }}"
          echo "build=${{ needs.build-windows.result }}"
          test "${{ needs.verify-windows-native.result }}" = "success"
          test "${{ needs.verify-windows-shard.result }}" = "success"
          test "${{ needs.build-windows.result }}" = "success"

name: CI

# CI (verify) runs only on the cicd branch — the release gate.
# Day-to-day development merges into develop via review only (no CI);
# the full verify suite runs once when a PR targets cicd, and again on
# push to cicd, right before tagging a release.
on:
  pull_request:
    branches:
      - cicd
  push:
    branches:
      - cicd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:resources:setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run readme:check
      - run: npm run builtin:manifest:check

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:resources:setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run readme:check
      - run: npm run builtin:manifest:check

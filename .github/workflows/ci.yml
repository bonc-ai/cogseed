name: CI

# CI (verify + verify-windows) runs only on the cicd branch — the release gate.
# Day-to-day development merges into develop via review only (no CI);
# the full macOS and Windows verification runs once when a PR targets cicd,
# and again on push to cicd, right before tagging a release.
on:
  pull_request:
    branches:
      - cicd
  push:
    branches:
      - cicd

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:resources:setup
      - run: npm run typecheck
      - run: npm run lint
      # 全量套件默认 maxWorkers=4，在 macos-latest（3 vCPU）上会过度抢占，
      # 负载型时序用例（CLI 版本探测、boot 恢复投影等）因此偶发超时红单。
      # 发布门禁优先稳定性：限制 2 个 worker，多花几分钟换可重复的绿。
      - run: node scripts/run-tests.mjs run --maxWorkers=2
      - run: npm run test:resources
      - run: npm run readme:check
      - run: npm run tokens:check
      - run: npm run builtin:manifest:check
      - name: Packaged macOS launch smoke
        run: npm run package:dev:mac && npm run verify:package:dev:mac
      - name: Email hygiene gate (release gate)
        if: github.event_name == 'push' || github.base_ref == 'cicd'
        run: |
          set -euo pipefail
          bad=$(git log --format='%h|%an|%ae' "origin/cicd..HEAD" 2>/dev/null \
            | grep -vE '\|([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits to cicd contain non-noreply author emails:"
            echo "$bad"
            exit 1
          fi
          echo "✅ All commit author emails are noreply."
          # Bodies / Co-authored-by trailers are public record too (#184 leak).
          bad_msg=$(git log --format='%h|%B' "origin/cicd..HEAD" 2>/dev/null \
            | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            | grep -viE '^([0-9]+\+[^@]+@users\.noreply\.github\.com|business@bonc\.com\.cn|support@github\.com)$' \
            | sort -u || true)
          if [ -n "$bad_msg" ]; then
            echo "::error::Commit messages / Co-authored-by contain non-allowlisted emails:"
            echo "$bad_msg"
            exit 1
          fi
          echo "✅ Commit messages and Co-authored-by trailers are clean."

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:resources:setup
      - run: npm run lint
      - name: P3394 Windows compatibility gate
        run: npm run test:p3394:windows
      - run: node scripts/run-tests.mjs run --maxWorkers=1
      - run: npm run test:resources
      - run: npm run test:platform-native
      - name: P3394 gateway protocol smoke
        run: node p3394-gateway/test/smoke.cjs
      - run: node scripts/write-build-info.cjs --channel=ci
      - run: npm run build:win
      - name: Packaged launch smoke
        run: npm run verify:package:launch
      - name: Packaged STT smoke
        run: npm run verify:package:stt:win
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: cogseed-windows-x64-${{ github.sha }}
          path: dist/CogSeed-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14

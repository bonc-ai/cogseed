name: Public Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'bonc-ai/cogseed'
    runs-on: ubuntu-24.04
    outputs:
      peeled-sha: ${{ steps.verify.outputs.peeled-sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact public main tip and required workflow attempts
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-gates.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verify.outputs.peeled-sha }}
      - name: Verify source version matches tag
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('package.json version does not match release tag')"

  build-macos:
    if: github.repository == 'bonc-ai/cogseed'
    needs: gate
    environment: release-signing
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.peeled-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create temporary keychain
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      # Bakes the service origin into .build/build-info.json. Without it the
      # packaged app falls back to the open-source placeholder origin and
      # account / marketplace / update endpoints are unreachable. The script
      # exits non-zero when a release build carries no origin, so a missing
      # variable blocks the release instead of shipping a dead installer.
      - run: node scripts/write-build-info.cjs --channel=release
        env:
          COGSEED_HUB_API_BASE: ${{ vars.COGSEED_HUB_API_BASE_URL }}
      - name: Build, sign, and notarize
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "const fs=require('node:fs'); const p=require('./package.json'); p.build.mac.notarize=true; p.build.files.push('!**/archive/**', '!**/*.tar.gz'); fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n')"
          npx electron-builder --mac --publish never
      - name: Verify packaged build metadata
        run: |
          npm run verify:package:build-info -- \
            --channel=release \
            --app=dist/mac-arm64/CogSeed.app \
            --app=dist/mac/CogSeed.app
      - name: Assert packaged Electron fuse baseline
        run: node scripts/check-fuses.cjs dist/mac-arm64/CogSeed.app dist/mac/CogSeed.app
      - name: Packaged launch smoke
        run: npm run verify:package:launch
      - uses: actions/upload-artifact@v4
        with:
          name: CogSeed-macOS-${{ needs.gate.outputs.peeled-sha }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  build-windows:
    if: github.repository == 'bonc-ai/cogseed'
    needs: gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.peeled-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/write-build-info.cjs --channel=release
        env:
          COGSEED_HUB_API_BASE: ${{ vars.COGSEED_HUB_API_BASE_URL }}
      - run: npm run build:win
      - name: Verify packaged build metadata
        run: npm run verify:package:build-info -- --channel=release
      - name: Assert packaged Electron fuse baseline
        run: node scripts/check-fuses.cjs dist/win-unpacked/CogSeed.exe
      - name: Packaged launch smoke
        run: npm run verify:package:launch
      - name: Packaged STT smoke
        run: npm run verify:package:stt:win
      - name: Generate Windows update feed entry
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist/CogSeed-*-win-x64.exe)
          if (-not $exe) { throw "no win-x64 installer found in dist/" }
          if ($exe.Count -gt 1) { throw "multiple win-x64 installers found: $($exe.Name -join ', ')" }
          $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLower()
          # LF-terminated "sha256  filename" sidecar so `sha256sum -c` verifies it.
          "$hash  $($exe[0].Name)`n" | Out-File -Encoding ascii -NoNewline "$($exe[0].FullName).sha256"
          node updates-server/publish.cjs $exe[0].FullName --platform win32 --arch x64 `
            --notes "${{ github.ref_name }}" --catalog dist/win-feed.json --no-copy
      - uses: actions/upload-artifact@v4
        with:
          name: CogSeed-windows-x64-${{ needs.gate.outputs.peeled-sha }}
          path: dist/CogSeed-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
      # The publish job downloads every `CogSeed-*` artifact and validates an
      # exact five-file installer set twice, so the feed metadata ships as its
      # own artifact instead of breaking that check.
      # The entry file is produced here for the release pipeline only; serving it
      # to the distribution feed requires the Hub-side endpoint (currently an
      # external dependency), so today the artifact is consumed manually or
      # expires with the artifact retention window.
      - name: Upload Windows update feed metadata
        uses: actions/upload-artifact@v4
        with:
          name: updates-win-feed-${{ needs.gate.outputs.peeled-sha }}
          path: |
            dist/*.exe.sha256
            dist/win-feed.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'bonc-ai/cogseed'
    needs: [gate, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.peeled-sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: CogSeed-*-${{ needs.gate.outputs.peeled-sha }}
          path: artifacts
          merge-multiple: true
      - name: Validate release artifact set
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('artifacts').sort();
          const version = process.env.GITHUB_REF_NAME.slice(1);
          const expected_files = [
            `CogSeed-${version}-mac-arm64.dmg`,
            `CogSeed-${version}-mac-arm64.zip`,
            `CogSeed-${version}-mac-x64.dmg`,
            `CogSeed-${version}-mac-x64.zip`,
            `CogSeed-${version}-win-x64.exe`,
          ].sort();
          if (JSON.stringify(files) !== JSON.stringify(expected_files)) {
            throw new Error(`Release artifact set mismatch. Expected ${expected_files.join(', ')}; got ${files.join(', ')}`);
          }
          NODE
      - name: Generate release checksums
        run: (cd artifacts && sha256sum CogSeed-* > SHA256SUMS.txt)
      - name: Revalidate public CI after builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-gates.mjs
      - name: Revalidate tag and existing Release
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.peeled-sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-gates.mjs --publish-target
      - name: Upload draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: false
          files: artifacts/*
          body: CogSeed ${{ github.ref_name }} signed release artifacts.
      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const json = execFileSync('gh', ['release', 'view', process.env.GITHUB_REF_NAME, '--json', 'assets,isDraft'], { encoding: 'utf8' });
          const release = JSON.parse(json);
          const names = release.assets.map((asset) => asset.name).sort();
          const version = process.env.GITHUB_REF_NAME.slice(1);
          const expected_files = [
            `CogSeed-${version}-mac-arm64.dmg`,
            `CogSeed-${version}-mac-arm64.zip`,
            `CogSeed-${version}-mac-x64.dmg`,
            `CogSeed-${version}-mac-x64.zip`,
            `CogSeed-${version}-win-x64.exe`,
            'SHA256SUMS.txt',
          ].sort();
          if (!release.isDraft || JSON.stringify(names) !== JSON.stringify(expected_files)) {
            throw new Error(`Draft asset verification failed. Expected ${expected_files.join(', ')}; got ${names.join(', ')}`);
          }
          NODE
          gh release edit "$GITHUB_REF_NAME" --draft=false

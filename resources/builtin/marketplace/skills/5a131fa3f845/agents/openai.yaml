interface:
  display_name: "需求证据综合"
  short_description: "把多来源需求转成可追溯的问题主题、证据账本和验证建议"
  default_prompt: "使用 $requirement-evidence：综合这些需求证据，区分事实、推断、假设与建议。"

# NSEAP-GATE:BEGIN
policy:
  allow_implicit_invocation: true
nseap_runtime:
  executor: "codex_skill_interpreter"
  binding_status: "target_state_not_run"
  skill_entrypoint: "../SKILL.md"
  schema_ref: "../schemas.json"
  permissions:
    direct_resource_access: false
    external_actions: "deny_without_explicit_approval"
    formal_asset_write: false
    candidate_write_only: true
  governance:
    level: "L5"
    risk_route: "Full"
    promotion_ceiling: "staged"
    production_release_allowed: false
    independent_review: "pending"
# NSEAP-GATE:END

# Runtime agent declaration for customer-profile-presales.
# Field-positions only — the skill declares what it needs; the Agent/Gateway layer injects
# real tools, identity and tokens. Skill holds no tokens, makes no direct resource calls.
agent:
  name: customer-profile-presales
  skill_class: execution
  session_role: master_task_skill
  owns_session: true
  promotion_ceiling: staged
  production_release_allowed: false
  tools:
    - name: read_customer_profile
      binding: gateway_only
      operation: read
      purpose: ontology_grounded_read
    - name: read_sales_qa_library
      binding: gateway_only
      operation: read
      purpose: objection_card_lookup
    - name: read_frozen_caliber
      binding: gateway_only
      operation: read
      purpose: caliber_source_of_truth
    - name: read_template_system
      binding: gateway_only
      operation: read
      purpose: deck_version_and_slot_map
  governance:
    hitl_required_for: [confirm, generate_deck]
    binding_resolved_by: agent_layer
    audit_emitted_by: runtime
    audit_append_only: true
    direct_resource_access: false
    access_via_gateway_only: true

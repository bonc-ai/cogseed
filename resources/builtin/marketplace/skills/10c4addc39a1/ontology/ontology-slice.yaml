rbox:
  - rule_id: R1
    formal: current policy and standard facts require opened primary sources
  - rule_id: R2
    formal: search snippets and model memory are not evidence
  - rule_id: R3
    formal: official policy defines default scene boundary
  - rule_id: R4
    formal: unresolved policy date, scope or standard version conflict blocks report generation
  - rule_id: R5
    formal: every report standard requires an official exact-name and version binding
  - rule_id: R6
    formal: domain reality, operational semantics, system representation and cognitive semantics remain distinct
  - rule_id: R7
    formal: full report contains 20-40 concepts and 5-10 processes
  - rule_id: R8
    formal: high-impact Agent actions require authorization, HITL, audit and review
  - rule_id: R9
    formal: DOCX delivery requires render, full visual review and accessibility audit
  - rule_id: R10
    formal: automatic promotion stops at staged
abox: {}

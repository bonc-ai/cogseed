api_version: cogseed.security/v1
kind: SkillArtifact
metadata:
  id: skill.cogseed.geo.probe
  name: geo-probe
  version: 1.0.0
  description: 'GEO visibility probe (two ops): op=queries generates representative
    prompts from the page topic+brand; op=score parses a set of model answers into
    brand-mention rate, sourced-citation rate (SoV) and competitor share, honestly
    separating parametric mentions from sourced citations;'
  owner: cogseed
spec:
  entrypoint: SKILL.md
  implementation:
    language: python
    scripts:
    - scripts/geo_probe.py
  security:
    ontology: cogseed.security.skill@1.1.1
    manifest_ref: references/security-manifest.yaml
  contracts:
    schemas: schemas.json
    skill_spec: references/skill-spec.yaml
    validation_contract: references/validation-contract.yaml
  tests:
    evals: evals/evals.json
  lifecycle:
    status: production
    rollback_ref: null

---
# ============================================================
# 个人本体候选构建器本体 — Package（包清单）
# 版本: v1.0.0
# 描述: 绑定所有本体资产，定义元数据和依赖
# 适用: 个人本体候选提炼（面向大众用户：学生/学者/FDE/普通用户）
# ============================================================

package_type: scene_ontology_package

scene:
  id: personal_ontology
  name: 个人本体候选构建
  version: "1.0.0"

# ============================================================
# 资产清单（Assets）
# ============================================================

assets:
  tbox:
    file: scene_tbox.yaml
    description: 概念层 — 候选类型/角色模板/来源/去向/脱敏状态等核心概念
    checksum: "sha256:placeholder"
  rbox:
    file: scene_rbox.yaml
    description: 规则层 — 确认制/local_only/追加不覆盖/敏感拦截/双区路由等规则
    checksum: "sha256:placeholder"
  abox:
    file: scene_abox.yaml
    description: 实例层 — 内置角色场景候选示例与阻断示例
    checksum: "sha256:placeholder"
  mapping:
    file: scene_mapping.yaml
    description: 映射层 — 候选/确认/分组/模板到物理数据源的映射
    checksum: "sha256:placeholder"

# ============================================================
# 元数据（Metadata）
# ============================================================

metadata:
  title: 个人本体候选构建
  description: 面向大众用户的个人本体候选提炼本体，覆盖候选类型（偏好/实例/属性/关系/规则）、角色模板（内置角色模板：学生/学者/FDE/产品经理/项目经理/技术写作/招聘专员/软件工程师）、来源追溯（候选/手动/导入/智能）、去向路由（全局记忆/分组字段区/分组流水区）等核心概念，为 CogSeed 的个人记忆沉淀提供领域知识支撑
  creator: CogSeed Team
  created: 2026-08-05
  modified: 2026-08-05
  license: Apache-2.0
  language: zh-CN
  domain: 个人知识管理 / 长期记忆 / 个人本体
  target_audience:
    - 大众用户（内置角色模板 + 普通用户）
    - 个人记忆整理 Agent
    - Meta-Skill Engine

# ============================================================
# 依赖（Dependencies）
# ============================================================

dependencies:
  - id: cogseed_kstar_spec
    name: CogSeed KSTAR 技能架构标准
    version: "1.0.0"
    type: standard

# ============================================================
# 运行时说明（Runtime Notes）
# ============================================================

runtime_note: |
  本本体服务于 CogSeed 的个人本体候选构建技能（personal-ontology-candidate-builder）：

  1. 运行时数据流（Electron 依赖，不可改变）：
     对话/记忆 → 技能提炼候选 → candidates.md（待确认池）→ 用户确认 →
     USER.md/MEMORY.md（全局记忆）和/或 记忆分组字段区/流水区

  2. 本本体是技能的领域知识层（概念/规则/示例），技能执行时按 SKILL.md
     的运行时契约产出 candidates.md；本体的规则与 SKILL.md 硬边界保持一致。

  3. 三套本体关系：本本体（个人本体候选领域）≠ KSTAR 任务技能本体
     （scene YAML，cloud/skills/<id>/ontology/）；两者通过映射层对接，
     角色模板（student/scholar/fde）是个人切片，不与企业组织本体混用。

# ============================================================
# 版本历史（Version History）
# ============================================================

version_history:
  - version: "1.0.0"
    date: 2026-08-05
    changes: |
      - 初始版本（适配大众用户，去除企业 FDE/业务一线/业务专家/运维角色）
      - 定义候选五类：偏好/实例/属性/关系/规则
      - 定义内置角色模板（与 role_templates.ts 一致）
      - 定义来源四值：候选/手动/导入/智能
      - 定义去向路由：user/shared 全局记忆 + 分组字段区/流水区
      - 规则与现有 SKILL.md 硬边界/生产数据格式对齐

# ============================================================
# 治理信息（Governance）
# ============================================================

governance:
  owner_team: CogSeed Team
  author_team: CogSeed Team
  approver_team: CogSeed Team
  source_mode: manual
  authority_level: staged
  data_boundary: internal
  export_allowed: false
  retention_policy_ref: local_only
  non_claim_note: "本本体描述候选提炼规则，不替代用户确认；所有候选必须经用户确认后才成为正式记忆"

manifest_version: "1.1.1"
security_ontology:
  id: cogseed.security.skill
  version: "1.1.1"
skill:
  id: skill.sample.local_format
  name: sample-local-format
  version: "1.0.0"
  description: Local text formatting with no external side effects. Not responsible for network or secrets.
  environment: development
  artifact_manifest_ref: artifact.yaml
  skill_spec_ref: references/skill-spec.yaml
  business_ontology_ref: references/business-ontology.yaml
ownership:
  human_owner: Alice Zhang
  organization: Platform Security
  role: Skill Owner
  technical_owner: null
provenance:
  source_type: internal
  source_uri: https://git.example.com/cogseed/sample-local-format
  author: Alice Zhang
  checksum: DEFERRED_UNTIL_FREEZE
  signature: null
permissions:
  required: []
  prohibited: ["admin.*", "network.*"]
resources:
  allowed: []
  denied: ["production://*"]
actions:
  allowed: []
  prohibited: ["DELETE", "TRANSFER_FUNDS"]
data_security:
  input_classification: [PUBLIC]
  output_classification: [PUBLIC]
  external_transmission: false
  pii_allowed: false
  secrets_allowed: false
  retention_days: 0
network:
  enabled: false
  allowlist: []
  deny_private_network: true
  allow_dynamic_download: false
runtime_boundary:
  runtime_contracts_ref: schemas.json#/runtime_contracts
  direct_resource_access: false
  access_via_gateway_only: true
  binding_resolved_by: agent_layer
  audit_emitted_by: runtime
risk:
  # 流程调整：risk 声明暂不填写；派生字段计算已停用
  risk_level: null
  trust_level: null
  risk_reasons: []
  maximum_impact: null
  calculated_risk_level: null
  effective_risk_level: null
  calculation_rule_version: null
  calculation_factors: null
  triggered_rule_ids: []
approval:
  required: false
  mode: none
  required_for_actions: []
  approver_roles: []
audit:
  enabled: true
  events: [result]
  include_input: false
  include_output: false
  include_tool_calls: false
  include_policy_decision: false
  retention_days: 30
rollback:
  supported: true
  type: disable_skill
  procedure: Disable skill via catalog flag
  maximum_recovery_time_minutes: 5
dependencies:
  packages: []
  external_tools: []
tests:
  evals_ref: evals/evals.json
  validation_contract_ref: references/validation-contract.yaml
  minimum_test_cases: 1

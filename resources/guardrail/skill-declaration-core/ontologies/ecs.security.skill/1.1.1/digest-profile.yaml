id: ecs.skill.fileset
version: "1.0.0"
ref: ecs.skill.fileset@1.0.0
algorithm: SHA-256
output_format: "sha256:<64-lowercase-hex>"
include:
  - artifact.yaml
  - manifest.yaml
  - SKILL.md
  - references/**
  - schemas/**
  - schemas.json
  - evals/**
  - scripts/**
exclude:
  - .git/**
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.DS_Store"
  - "**/node_modules/**"
  - "**/.pytest_cache/**"
  - reports/**
  - .nseap/**
  - "**/*.tmp"
  - "**/*~"
symlink_policy: BLOCK
hardlink_escape_policy: BLOCK
device_socket_fifo_policy: BLOCK
text_hashing: raw_bytes
fileset_encoding:
  utf8: true
  nfc_keys: true
  sort_keys: true
  no_insignificant_whitespace: true
path_rules:
  relative_to_skill_root: true
  separator: "/"
  sort: utf8_byte_order
  deny_duplicate_normalized_paths: true

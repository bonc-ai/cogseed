  - path: network.allow_dynamic_download
    type: boolean
    required: true
    filler: creator
    meaning: 是否允许运行时动态下载；默认必须为 false。
    enum: null
    default: false
    const_recommended: false

  - path: runtime_boundary.runtime_contracts_ref
    type: path_ref
    required: true
    filler: creator
    meaning: 指向 schemas.json#/runtime_contracts。
    enum: null

  - path: runtime_boundary.direct_resource_access
    type: boolean
    required: true
    filler: creator
    meaning: 必须为 false，Skill 不直接持有资源绑定。
    enum: null
    const: false

  - path: runtime_boundary.access_via_gateway_only
    type: boolean
    required: true
    filler: creator
    meaning: 必须为 true，资源访问经网关或受控执行器。
    enum: null
    const: true

  - path: runtime_boundary.binding_resolved_by
    type: enum
    required: true
    filler: creator
    meaning: 固定为 agent_layer，由 Agent 层解析绑定。
    enum: [agent_layer]
    const: agent_layer

  - path: runtime_boundary.audit_emitted_by
    type: enum
    required: true
    filler: creator

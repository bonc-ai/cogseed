  - path: provenance.source_type
    type: enum
    required: true
    filler: creator
    meaning: 制品来源类型。
    enum: [internal, generated, third_party, modified_third_party]

  - path: provenance.source_uri
    type: string
    required: true
    filler: creator
    meaning: 代码仓库、材料快照或制品来源。
    enum: null

  - path: provenance.author
    type: string
    required: true
    filler: creator
    meaning: 作者或生成者。
    enum: null

  - path: provenance.checksum
    type: string
    required: true
    filler: security_core
    meaning: 制品摘要，正式打包/冻结时由 Security Core 生成；PREVALIDATION 可为 DEFERRED_UNTIL_FREEZE；冻结后等于 subject_digest。
    enum: null
    pattern: "DEFERRED_UNTIL_FREEZE | sha256:<64-hex>"
    mode:
      PREVALIDATION: { allow_deferred: true }
      FREEZE: { allow_deferred: false }
      FORMAL_TEST: { allow_deferred: false }

  - path: provenance.signature
    type: string
    required: false
    filler: creator
    meaning: 制品签名，staging/production 建议填写。
    enum: null

  - path: permissions.required
    type: object_array
    required: true
    filler: creator
    meaning: 最小权限；每项包含 id、resource、actions、scope、reason。
    enum: null
    item_fields: [id, resource, actions, scope, reason]

  - path: permissions.prohibited
    type: string_array
    required: true
    filler: creator

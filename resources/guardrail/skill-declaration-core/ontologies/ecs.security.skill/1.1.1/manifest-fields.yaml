    const: runtime

  - path: risk.risk_level
    type: enum
    required: true
    filler: creator
    meaning: L0-L5 动作与业务风险等级（声明值 declared_risk）。
    enum: [L0, L1, L2, L3, L4, L5]

  - path: risk.trust_level
    type: enum
    required: true
    filler: creator
    meaning: T0-T4 信任等级。
    enum: [T0, T1, T2, T3, T4]

  - path: risk.risk_reasons
    type: string_array
    required: true
    filler: creator
    meaning: 风险等级的判定理由。
    enum: null

  - path: risk.maximum_impact
    type: string
    required: true
    filler: creator
    meaning: 失败、越权或滥用可能产生的最大影响。
    enum: null

  - path: risk.calculated_risk_level
    type: enum
    required: false
    filler: security_core
    meaning: 依据五维规则从动作、数据、环境、访问边界和最大影响中确定性计算；Creator 不得手工填写。
    enum: [L0, L1, L2, L3, L4, L5]
    derived: true

  - path: risk.effective_risk_level
    type: enum
    required: false
    filler: security_core
    meaning: 取 declared_risk 与 calculated_risk 的较高者，作为审批、审计和回滚校验基准。
    enum: [L0, L1, L2, L3, L4, L5]
    derived: true

  - path: risk.calculation_rule_version
    type: string
    required: false
    filler: security_core
    meaning: 记录本次风险计算所使用的规则版本，必须与 Ontology 快照绑定。
    enum: null
    derived: true

  - path: risk.calculation_factors
    type: object
    required: false
    filler: security_core
    meaning: 记录 action、data、environment、access、impact 五个维度的分级及命中的 rule_id，支持复核与重放。
    enum: null
    derived: true

  - path: risk.triggered_rule_ids
    type: string_array
    required: false
    filler: security_core
    meaning: 记录所有触发风险分级或强制升级的规则 ID；不得只输出最终等级而不保留依据。
    enum: null
    derived: true


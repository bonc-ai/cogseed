id: ecs.security.skill
version: "1.1.1"
status: current
display_name: ECS Security Skill Ontology
engine_compat:
  - "1.3.0"
artifacts:
  schema: manifest.schema.json
  template: security-manifest.template.yaml
  fields: manifest-fields.yaml
  artifact_template: artifact-manifest.template.yaml
  artifact_fields: artifact-fields.yaml
  compatibility_template: compatibility-manifest.template.yaml
  derivation_rules: derivation-rules.yaml
  trust_rules: trust-rules.yaml
  consistency_rules: consistency-rules.yaml
  warning_policy: warning-policy.yaml
  digest_profile: digest-profile.yaml
  version_policy: version-policy.yaml
rule_index:
  derivation:
    policy_version: "1.1.1"
    file: derivation-rules.yaml
  trust:
    policy_version: "1.1.1"
    file: trust-rules.yaml
  consistency:
    policy_version: "1.1.1"
    file: consistency-rules.yaml
  warning:
    policy_version: "1.1.1"
    file: warning-policy.yaml
  digest:
    policy_version: "1.0.0"
    profile_ref: ecs.skill.fileset@1.0.0
    file: digest-profile.yaml

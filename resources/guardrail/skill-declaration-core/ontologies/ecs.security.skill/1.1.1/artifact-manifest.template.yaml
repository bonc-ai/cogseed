# §6.3 Artifact Manifest 模板（根目录 artifact.yaml）
# api_version / kind 当前固定为 ecs.nseap/v1alpha1、SkillArtifact
# manifest.yaml 由其单向生成，不得反向改写 artifact.yaml

api_version: ecs.nseap/v1alpha1
kind: SkillArtifact
metadata:
  id: REQUIRED_INPUT
  name: REQUIRED_INPUT
  version: REQUIRED_INPUT
  description: REQUIRED_INPUT
  owner: REQUIRED_INPUT
spec:
  entrypoint: SKILL.md
  implementation:
    language: REQUIRED_INPUT
    scripts: []
  security:
    ontology: ecs.security.skill@1.1.1
    manifest_ref: references/security-manifest.yaml
  contracts:
    schemas: schemas.json
    skill_spec: references/skill-spec.yaml
    validation_contract: references/validation-contract.yaml
  tests:
    evals: evals/evals.json
  lifecycle:
    status: development
    rollback_ref: null

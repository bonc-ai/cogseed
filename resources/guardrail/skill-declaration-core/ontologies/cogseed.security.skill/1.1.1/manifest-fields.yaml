# 安全声明字段目录（cogseed.security.skill@1.1.1）
# 依据：CogSeed Skill 准入设计规范 §6.1 声明字段清单，§6.2 派生字段（已停用）
# 本文件是 3.1 describe-field / list-fields 的唯一机器可读数据源

catalog_version: "1.1.1"
ontology_id: cogseed.security.skill
ontology_version: "1.1.1"
source: "CogSeed Skill Admission Design §6.1 / §6.2"

fields:
  - path: manifest_version
    type: string
    required: true
    filler: creator
    meaning: 声明模板自身的版本号，须与引擎所加载的模板版本一致。
    enum: null

  - path: security_ontology.id
    type: string
    required: true
    filler: creator
    meaning: 本字段只允许 cogseed.security.skill 这一个取值。
    enum: [cogseed.security.skill]
    const: cogseed.security.skill

  - path: security_ontology.version
    type: string
    required: true
    filler: creator
    meaning: 本声明引用的安全本体快照版本，如 1.1.1。
    enum: null

  - path: skill.id
    type: string
    required: true
    filler: creator
    meaning: 该 Skill 在整个平台范围内的唯一编号。
    enum: null

  - path: skill.name
    type: string
    required: true
    filler: creator
    meaning: 对外展示的 Skill 名称。
    enum: null

  - path: skill.version
    type: string
    required: true
    filler: creator
    meaning: Skill 自身的版本号，推荐语义化版本格式。
    enum: null

  - path: skill.description
    type: string
    required: true
    filler: creator
    meaning: 写清楚能力范围、适用场景以及明确不做的事情。
    enum: null

  - path: skill.environment
    type: enum
    required: true
    filler: creator
    meaning: 声明 Skill 计划运行于哪个环境（development/test/staging/production）。
    enum: [development, test, staging, production]

  - path: skill.artifact_manifest_ref
    type: path
    required: true
    filler: creator
    meaning: 制品主清单的引用路径，位于仓库根目录的 artifact.yaml。
    enum: null

  - path: skill.skill_spec_ref
    type: path
    required: true
    filler: creator
    meaning: 能力规格文件的引用路径（references/skill-spec.yaml）。
    enum: null

  - path: skill.business_ontology_ref
    type: path
    required: true
    filler: creator
    meaning: 业务本体映射文件的引用路径。
    enum: null

  - path: ownership.human_owner
    type: string
    required: true
    filler: creator
    meaning: 最终负责的人；生产环境下禁止使用占位文本。
    enum: null

  - path: ownership.organization
    type: string
    required: true
    filler: creator
    meaning: 负责该 Skill 的组织或团队名称。
    enum: null

  - path: ownership.role
    type: string
    required: true
    filler: creator
    meaning: 责任人在组织中所担任的角色。
    enum: null

  - path: ownership.technical_owner
    type: string
    required: false
    filler: creator
    meaning: 日常技术维护的负责人；开发与测试环境允许留空。
    enum: null

  - path: provenance.source_type
    type: enum
    required: true
    filler: creator
    meaning: 制品从何处产生（自研/生成/第三方等）。
    enum: [internal, generated, third_party, modified_third_party]

  - path: provenance.source_uri
    type: string
    required: true
    filler: creator
    meaning: 来源的具体地址：代码仓、材料快照或制品链接。
    enum: null

  - path: provenance.author
    type: string
    required: true
    filler: creator
    meaning: 作者或生成该制品的主体。
    enum: null

  - path: provenance.checksum
    type: string
    required: true
    filler: security_core
    meaning: 制品指纹，冻结阶段由引擎写入；预检阶段可填 DEFERRED_UNTIL_FREEZE；冻结完成后与 subject_digest 相同。
    enum: null
    pattern: "DEFERRED_UNTIL_FREEZE | sha256:<64-hex>"
    mode:
      PREVALIDATION: { allow_deferred: true }
      FREEZE: { allow_deferred: false }
      FORMAL_TEST: { allow_deferred: false }

  - path: provenance.signature
    type: string
    required: false
    filler: creator
    meaning: 制品签名；进入 staging/production 前建议补齐。
    enum: null

  - path: permissions.required
    type: object_array
    required: true
    filler: creator
    meaning: 最小权限集合；每项须含 id、resource、actions、scope、reason。
    enum: null
    item_fields: [id, resource, actions, scope, reason]

  - path: permissions.prohibited
    type: string_array
    required: true
    filler: creator
    meaning: 不允许授予的权限清单。
    enum: null

  - path: resources.allowed
    type: object_array
    required: true
    filler: creator
    meaning: 被允许访问的资源及其类型、方式和范围。
    enum: null

  - path: resources.denied
    type: string_array
    required: true
    filler: creator
    meaning: 不允许访问的资源清单。
    enum: null

  - path: actions.allowed
    type: object_array
    required: true
    filler: creator
    meaning: 被允许执行的动作，需描述 effect、target、可逆性与预期结果。
    enum: null
    item_fields: [id, effect, target, recoverable, expected_result, permission_id]

  - path: actions.prohibited
    type: string_array
    required: true
    filler: creator
    meaning: 被禁止的动作，例如未经审批的删除、直写生产环境。
    enum: null

  - path: data_security.input_classification
    type: enum_array
    required: true
    filler: creator
    meaning: 流入该 Skill 的数据安全级别。
    enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]

  - path: data_security.output_classification
    type: enum_array
    required: true
    filler: creator
    meaning: 该 Skill 产出数据的安全级别。
    enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]

  - path: data_security.external_transmission
    type: boolean
    required: true
    filler: creator
    meaning: 数据是否允许离开受控边界。
    enum: null

  - path: data_security.pii_allowed
    type: boolean
    required: true
    filler: creator
    meaning: 是否允许接触个人身份信息。
    enum: null

  - path: data_security.secrets_allowed
    type: boolean
    required: true
    filler: creator
    meaning: 是否允许处理凭据类数据；缺省为 false。
    enum: null
    default: false

  - path: data_security.retention_days
    type: integer
    required: true
    filler: creator
    meaning: 数据留存时长（天），0 表示不落盘。
    enum: null

  - path: network.enabled
    type: boolean
    required: true
    filler: creator
    meaning: 该 Skill 是否需要联网。
    enum: null

  - path: network.allowlist
    type: string_array
    required: true
    filler: creator
    meaning: 联网时的访问白名单；开启网络时必须给出非空、无通配的列表。
    enum: null

  - path: network.deny_private_network
    type: boolean
    required: true
    filler: creator
    meaning: 是否阻断对未授权内网地址的访问。
    enum: null

  - path: network.allow_dynamic_download
    type: boolean
    required: true
    filler: creator
    meaning: 是否允许运行时拉取远程内容；缺省必须为 false。
    enum: null
    default: false
    const_recommended: false

  - path: runtime_boundary.runtime_contracts_ref
    type: path_ref
    required: true
    filler: creator
    meaning: 运行时契约的引用位置：schemas.json#/runtime_contracts。
    enum: null

  - path: runtime_boundary.direct_resource_access
    type: boolean
    required: true
    filler: creator
    meaning: 恒为 false：Skill 不得直接持有资源绑定。
    enum: null
    const: false

  - path: runtime_boundary.access_via_gateway_only
    type: boolean
    required: true
    filler: creator
    meaning: 恒为 true：所有资源访问都必须经由网关或受控执行器。
    enum: null
    const: true

  - path: runtime_boundary.binding_resolved_by
    type: enum
    required: true
    filler: creator
    meaning: 恒为 agent_layer：绑定解析发生在 Agent 层。
    enum: [agent_layer]
    const: agent_layer

  - path: runtime_boundary.audit_emitted_by
    type: enum
    required: true
    filler: creator
    meaning: 恒为 runtime：审计事件统一由运行时产生。
    enum: [runtime]
    const: runtime

  - path: risk.risk_level
    type: enum
    required: true
    filler: creator
    meaning: 声明者给出的 L0–L5 动作与业务风险等级（declared_risk）。
    enum: [L0, L1, L2, L3, L4, L5]

  - path: risk.trust_level
    type: enum
    required: true
    filler: creator
    meaning: T0–T4 的信任等级声明。
    enum: [T0, T1, T2, T3, T4]

  - path: risk.risk_reasons
    type: string_array
    required: true
    filler: creator
    meaning: 给出上述风险等级的理由。
    enum: null

  - path: risk.maximum_impact
    type: string
    required: true
    filler: creator
    meaning: 一旦失败、越权或被滥用，可能造成的最大影响。
    enum: null

  - path: risk.calculated_risk_level
    type: enum
    required: false
    filler: security_core
    meaning: 由五维规则（动作/数据/环境/访问边界/最大影响）确定性推导；创建者不可手填。
    enum: [L0, L1, L2, L3, L4, L5]
    derived: true

  - path: risk.effective_risk_level
    type: enum
    required: false
    filler: security_core
    meaning: 取声明值与计算值中的更高级别，作为审批、审计与回滚校验的基准。
    enum: [L0, L1, L2, L3, L4, L5]
    derived: true

  - path: risk.calculation_rule_version
    type: string
    required: false
    filler: security_core
    meaning: 本次风险计算所用规则集的版本，必须与本体快照绑定。
    enum: null
    derived: true

  - path: risk.calculation_factors
    type: object
    required: false
    filler: security_core
    meaning: 按动作/数据/环境/访问/影响五个维度记录分级与命中的规则编号，供复核与重放。
    enum: null
    derived: true

  - path: risk.triggered_rule_ids
    type: string_array
    required: false
    filler: security_core
    meaning: 记录触发分级或强制升级的全部规则编号；禁止只给结论不给依据。
    enum: null
    derived: true

  - path: approval.required
    type: boolean
    required: true
    filler: creator
    meaning: 是否需要人工审批。
    enum: null

  - path: approval.mode
    type: enum
    required: true
    filler: creator
    meaning: 审批走什么模式。
    enum: [none, single, dual, security_review]

  - path: approval.required_for_actions
    type: string_array
    required: true
    filler: creator
    meaning: 哪些动作必须先经过审批。
    enum: null

  - path: approval.approver_roles
    type: string_array
    required: true
    filler: creator
    meaning: 哪些岗位或角色有权审批。
    enum: null

  - path: audit.enabled
    type: boolean
    required: true
    filler: creator
    meaning: 是否开启审计；生产环境强制开启。
    enum: null

  - path: audit.events
    type: string_array
    required: true
    filler: creator
    meaning: 需要留痕的事件类别。
    enum: null

  - path: audit.include_input
    type: boolean
    required: true
    filler: creator
    meaning: 是否留痕输入内容；敏感输入可只存摘要或脱敏后的值。
    enum: null

  - path: audit.include_output
    type: boolean
    required: true
    filler: creator
    meaning: 是否留痕输出内容。
    enum: null

  - path: audit.include_tool_calls
    type: boolean
    required: true
    filler: creator
    meaning: 是否留痕每一次工具调用。
    enum: null

  - path: audit.include_policy_decision
    type: boolean
    required: true
    filler: creator
    meaning: 是否留痕策略判定过程。
    enum: null

  - path: audit.retention_days
    type: integer
    required: true
    filler: creator
    meaning: 审计记录的留存天数。
    enum: null

  - path: rollback.supported
    type: boolean
    required: true
    filler: creator
    meaning: 是否具备停用或回滚能力。
    enum: null

  - path: rollback.type
    type: enum
    required: true
    filler: creator
    meaning: 回滚方式，如 disable_skill、revert_version 等。
    enum: [disable_skill, revert_version]

  - path: rollback.procedure
    type: string
    required: true
    filler: creator
    meaning: 回滚的具体操作步骤。
    enum: null

  - path: rollback.maximum_recovery_time_minutes
    type: integer
    required: true
    filler: creator
    meaning: 最长恢复耗时（分钟）。
    enum: null

  - path: dependencies.packages
    type: object_array
    required: true
    filler: creator
    meaning: 软件包依赖列表；没有依赖就留空数组。
    enum: null

  - path: dependencies.external_tools
    type: object_array
    required: true
    filler: creator
    meaning: 外部工具依赖列表；没有依赖就留空数组。
    enum: null

  - path: tests.evals_ref
    type: path
    required: true
    filler: creator
    meaning: 评估用例的引用路径：evals/evals.json。
    enum: null

  - path: tests.validation_contract_ref
    type: path
    required: true
    filler: creator
    meaning: 验证契约文件的引用路径。
    enum: null

  - path: tests.minimum_test_cases
    type: integer
    required: true
    filler: creator
    meaning: 最少需要的测试用例数，至少为 1。
    enum: null
    minimum: 1

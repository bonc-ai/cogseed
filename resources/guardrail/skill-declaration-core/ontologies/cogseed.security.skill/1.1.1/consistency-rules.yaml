    check: provenance_checksum_equals_subject_digest
    severity: BLOCK
  - rule_id: SEC-SUBJECT-MUTATED-001
    check: subject_digest_stable_across_test
    severity: BLOCK
  - rule_id: SEC-DERIVED-NORMALIZE-001
    check: derived_fields_canonical_compare
    severity: BLOCK
  - rule_id: SEC-REPORT-ISOLATION-001
    check: report_not_from_creator_writable
    severity: BLOCK
  - rule_id: SEC-FREEZE-MANIFEST-001
    check: freeze_manifest_orchestrator_controlled
    severity: BLOCK
  - rule_id: SEC-FREEZE-READINESS-001
    check: worktree_digest_fresh
    severity: NOT_READY
  - rule_id: SEC-ACTION-IRREVERSIBLE-001
    check: irreversible_delete_block
    severity: BLOCK
  - rule_id: SEC-ACTION-UNBOUNDED-001
    check: unbounded_financial_privilege_physical_block
    severity: BLOCK
  - rule_id: SEC-WARNING-POLICY-001
    check: warn_metadata_present_or_fail_closed
    severity: FAIL
  - rule_id: SEC-TRUST-001
    check: trust_not_overdeclared
    severity: BLOCK
  - rule_id: SEC-TRUST-CONTROL-002
    check: trust_modifier_controls_met
    severity: BLOCK

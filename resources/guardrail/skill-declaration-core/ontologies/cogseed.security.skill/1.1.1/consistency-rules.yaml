policy_version: "1.1.1"
ontology_id: cogseed.security.skill
ontology_version: "1.1.1"

rules:
  - rule_id: SEC-ONTOLOGY-001
    check: ontology_id_equals
    expected: cogseed.security.skill
    severity: BLOCK
  - rule_id: SEC-ONTOLOGY-002
    check: ontology_version_matches_loaded_core
    severity: BLOCK
  - rule_id: SEC-OWNER-001
    check: production_human_owner_not_placeholder
    severity: BLOCK
  - rule_id: SEC-PERMISSION-001
    check: no_wildcard_permissions
    severity: BLOCK
  - rule_id: SEC-BOUNDARY-001
    check: direct_resource_access_false
    severity: BLOCK
  - rule_id: SEC-BOUNDARY-002
    check: access_via_gateway_only_true
    severity: BLOCK
  - rule_id: SEC-BOUNDARY-003
    check: binding_resolved_by_agent_layer
    severity: BLOCK
  - rule_id: SEC-BOUNDARY-004
    check: audit_emitted_by_runtime
    severity: BLOCK
  - rule_id: SEC-NETWORK-001
    check: allow_dynamic_download_false
    severity: BLOCK
  - rule_id: SEC-NETWORK-002
    check: network_enabled_requires_explicit_allowlist
    severity: BLOCK
  - rule_id: SEC-NETWORK-003
    check: network_disabled_no_external_access
    severity: FAIL
  - rule_id: SEC-ACTION-001
    check: irreversible_or_financial_actions_require_approval
    severity: BLOCK
  - rule_id: SEC-RISK-001
    check: approval_meets_effective_risk
    severity: BLOCK
  - rule_id: SEC-AUDIT-001
    check: production_audit_enabled
    severity: BLOCK
  - rule_id: SEC-ROLLBACK-001
    check: l2_to_l5_rollback_supported
    severity: FAIL
  - rule_id: SEC-TEST-001
    check: tests_present_min_one_case
    severity: FAIL
  - rule_id: SEC-ARTIFACT-MANIFEST-001
    check: artifact_yaml_exists
    severity: BLOCK
  - rule_id: SEC-ARTIFACT-MANIFEST-002
    check: security_manifest_ref_correct
    severity: BLOCK
  - rule_id: SEC-APR-UNBOUND-ACTION-001
    check: action_bound_to_permission
    severity: BLOCK
  - rule_id: SEC-APR-UNUSED-PERMISSION-001
    check: unused_permission_by_type
    severity_by_type:
      READ: WARN
      WRITE: FAIL
      DELETE: BLOCK
      ADMIN: BLOCK
  - rule_id: SEC-APR-UNUSED-RESOURCE-001
    check: unused_resource
    severity: WARN
  - rule_id: SEC-DUAL-MANIFEST-001
    check: artifact_manifest_consistency
    severity: FAIL
  - rule_id: SEC-DIGEST-001
    check: formal_digest_present_and_match
    severity: BLOCK

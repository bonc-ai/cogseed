policy_version: "1.1.1"
ontology_id: cogseed.security.skill
ontology_version: "1.1.1"

control_rank:
  none: 0
  single: 1
  dual: 2
  security_review: 3

levels:
  T0:
    max_source_types: [internal]
    requires: [owner, source_uri, frozen_checksum, source_policy_pass]
    trust_modifier: none
  T1:
    max_source_types: [internal, generated]
    requires: [owner, source_uri, complete_chain]
    trust_modifier: security_role_on_l4_l5
  T2:
    max_source_types: [generated, internal, modified_third_party]
    requires: [traceable_source]
    trust_modifier: dual_when_effective_ge_l3
  T3:
    max_source_types: [third_party, modified_third_party]
    requires: []
    trust_modifier: security_review_on_write_network_sensitive
    formal_test_isolation: sandbox_only
  T4:
    max_source_types: [unknown]
    requires: []
    trust_modifier: block_final_pass
    formal_test_isolation: sandbox_only

rules:
  - rule_id: SEC-TRUST-001
    when: declared_trust_higher_than_evidence
    result: BLOCK
  - rule_id: SEC-TRUST-CONSERVATIVE-001
    when: declared_trust_lower_than_evidence
    result: WARN
  - rule_id: SEC-TRUST-UNRESOLVED-001
    when: trust_unresolvable
    prevalidation: NEEDS_INPUT
    formal_test: BLOCK
    force_level: T4
  - rule_id: SEC-TRUST-CONTROL-002
    when: trust_modifier_controls_unmet
    result: BLOCK

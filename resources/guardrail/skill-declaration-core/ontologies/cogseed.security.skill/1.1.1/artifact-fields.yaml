# 制品主清单字段目录（根目录 artifact.yaml）
# 依据：CogSeed Skill 准入设计规范 §6.3 制品清单
catalog_version: "1.1.1"
ontology_id: cogseed.security.skill
ontology_version: "1.1.1"
kind: SkillArtifact
source: "CogSeed Skill Admission Design §6.3"
target_file: artifact.yaml

fields:
  - path: api_version
    type: string
    required: true
    filler: creator
    meaning: 制品遵循的规范版本，现行为 cogseed.security/v1。
    enum: [cogseed.security/v1]
    const: cogseed.security/v1

  - path: kind
    type: string
    required: true
    filler: creator
    meaning: 制品类别，现行为 SkillArtifact。
    enum: [SkillArtifact]
    const: SkillArtifact

  - path: metadata
    type: object
    required: true
    filler: creator
    meaning: 制品的编号、名称、版本、描述与所有者信息。
    enum: null

  - path: metadata.id
    type: string
    required: true
    filler: creator
    meaning: 制品全局唯一编号，须与安全声明中的 skill.id 相同。
    enum: null

  - path: metadata.name
    type: string
    required: true
    filler: creator
    meaning: 制品名称，须与安全声明中的 skill.name 相同。
    enum: null

  - path: metadata.version
    type: string
    required: true
    filler: creator
    meaning: 制品版本，须与安全声明中的 skill.version 相同。
    enum: null

  - path: metadata.description
    type: string
    required: true
    filler: creator
    meaning: 对制品的简要说明。
    enum: null

  - path: metadata.owner
    type: string
    required: true
    filler: creator
    meaning: 制品归属的组织或团队。
    enum: null

  - path: spec.entrypoint
    type: path
    required: true
    filler: creator
    meaning: Skill 的入口文件，一般就是 SKILL.md。
    enum: null
    default: SKILL.md

  - path: spec.implementation
    type: object
    required: true
    filler: creator
    meaning: 实现语言与脚本文件清单。
    enum: null

  - path: spec.implementation.language
    type: string
    required: true
    filler: creator
    meaning: 实现所用语言，例如 python、markdown、typescript。
    enum: null

  - path: spec.implementation.scripts
    type: string_array
    required: true
    filler: creator
    meaning: 实现脚本的路径列表；没有脚本就留空数组。
    enum: null
    default: []

  - path: spec.security
    type: object
    required: true
    filler: creator
    meaning: 安全本体版本与安全声明文件路径。
    enum: null

  - path: spec.security.ontology
    type: string
    required: true
    filler: creator
    meaning: 安全本体的引用写法 id@version，如 cogseed.security.skill@1.1.1。
    enum: null
    pattern: "cogseed.security.skill@<semver>"

  - path: spec.security.manifest_ref
    type: path
    required: true
    filler: creator
    meaning: 安全声明路径，固定为 references/security-manifest.yaml。
    enum: null
    default: references/security-manifest.yaml
    const_recommended: references/security-manifest.yaml

  - path: spec.contracts
    type: object
    required: true
    filler: creator
    meaning: schemas.json、skill-spec、validation-contract 三类契约的路径。
    enum: null

  - path: spec.contracts.schemas
    type: path
    required: true
    filler: creator
    meaning: 契约 schema 路径，通常为 schemas.json。
    enum: null
    default: schemas.json

  - path: spec.contracts.skill_spec
    type: path
    required: true
    filler: creator
    meaning: 能力规格路径，通常为 references/skill-spec.yaml。
    enum: null
    default: references/skill-spec.yaml

  - path: spec.contracts.validation_contract
    type: path
    required: true
    filler: creator
    meaning: 验证契约路径，通常为 references/validation-contract.yaml。
    enum: null
    default: references/validation-contract.yaml

  - path: spec.tests
    type: object
    required: true
    filler: creator
    meaning: 测试引用集合。
    enum: null

  - path: spec.tests.evals
    type: path
    required: true
    filler: creator
    meaning: 评估用例路径：evals/evals.json。
    enum: null
    default: evals/evals.json

  - path: spec.lifecycle
    type: object
    required: true
    filler: creator
    meaning: 开发状态与回滚声明的引用。
    enum: null

  - path: spec.lifecycle.status
    type: enum
    required: true
    filler: creator
    meaning: 制品当前所处的生命周期阶段。
    enum: [development, test, staging, production, deprecated]
    default: development

  - path: spec.lifecycle.rollback_ref
    type: path
    required: false
    filler: creator
    meaning: 回滚声明的引用路径，允许为空。
    enum: null

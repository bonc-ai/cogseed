# Artifact Manifest field catalog — design doc §6.3 (0715 baseline)
catalog_version: "1.1.1"
ontology_id: cogseed.security.skill
ontology_version: "1.1.1"
kind: SkillArtifact
source: "ECS_Security_3.1_3.2_Skill集成设计 §6.3"
target_file: artifact.yaml

fields:
  - path: api_version
    type: string
    required: true
    filler: creator
    meaning: 制品规范版本，当前为 cogseed.security/v1。
    enum: [cogseed.security/v1]
    const: cogseed.security/v1

  - path: kind
    type: string
    required: true
    filler: creator
    meaning: 制品类型，当前为 SkillArtifact。
    enum: [SkillArtifact]
    const: SkillArtifact

  - path: metadata
    type: object
    required: true
    filler: creator
    meaning: 制品 id、name、version、description、owner。
    enum: null

  - path: metadata.id
    type: string
    required: true
    filler: creator
    meaning: 制品全局唯一标识，应与 security-manifest skill.id 一致。
    enum: null

  - path: metadata.name
    type: string
    required: true
    filler: creator
    meaning: 制品名称，应与 security-manifest skill.name 一致。
    enum: null

  - path: metadata.version
    type: string
    required: true
    filler: creator
    meaning: 制品版本，应与 security-manifest skill.version 一致。
    enum: null

  - path: metadata.description
    type: string
    required: true
    filler: creator
    meaning: 制品描述。
    enum: null

  - path: metadata.owner
    type: string
    required: true
    filler: creator
    meaning: 制品所有者（组织或团队）。
    enum: null

  - path: spec.entrypoint
    type: path
    required: true
    filler: creator
    meaning: Skill 入口，通常为 SKILL.md。
    enum: null
    default: SKILL.md

  - path: spec.implementation
    type: object
    required: true
    filler: creator
    meaning: 实现语言和脚本列表。
    enum: null

  - path: spec.implementation.language
    type: string
    required: true
    filler: creator
    meaning: 实现语言（如 python、markdown、typescript）。
    enum: null

  - path: spec.implementation.scripts
    type: string_array
    required: true
    filler: creator
    meaning: 实现脚本路径列表；无脚本时使用空数组。
    enum: null
    default: []

  - path: spec.security
    type: object
    required: true
    filler: creator
    meaning: 安全本体版本及 references/security-manifest.yaml 路径。
    enum: null

  - path: spec.security.ontology
    type: string
    required: true
    filler: creator
    meaning: 安全本体引用，格式 id@version，例如 cogseed.security.skill@1.1.1。
    enum: null
    pattern: "cogseed.security.skill@<semver>"

  - path: spec.security.manifest_ref
    type: path
    required: true
    filler: creator
    meaning: Security Manifest 路径，固定指向 references/security-manifest.yaml。
    enum: null
    default: references/security-manifest.yaml
    const_recommended: references/security-manifest.yaml

  - path: spec.contracts
    type: object
    required: true
    filler: creator
    meaning: schemas.json、skill-spec 和 validation-contract 的路径。
    enum: null

  - path: spec.contracts.schemas
    type: path
    required: true
    filler: creator
    meaning: 契约 schemas 路径，通常为 schemas.json。
    enum: null
    default: schemas.json

  - path: spec.contracts.skill_spec
    type: path
    required: true
    filler: creator
    meaning: skill-spec 路径，通常为 references/skill-spec.yaml。
    enum: null
    default: references/skill-spec.yaml

  - path: spec.contracts.validation_contract
    type: path
    required: true
    filler: creator
    meaning: validation-contract 路径，通常为 references/validation-contract.yaml。
    enum: null
    default: references/validation-contract.yaml

  - path: spec.tests
    type: object
    required: true
    filler: creator
    meaning: 测试引用组。
    enum: null

  - path: spec.tests.evals
    type: path
    required: true
    filler: creator
    meaning: evals/evals.json 路径。
    enum: null
    default: evals/evals.json

  - path: spec.lifecycle
    type: object
    required: true
    filler: creator
    meaning: 开发状态及回滚声明引用。
    enum: null

  - path: spec.lifecycle.status
    type: enum
    required: true
    filler: creator
    meaning: 生命周期状态。
    enum: [development, test, staging, production, deprecated]
    default: development

  - path: spec.lifecycle.rollback_ref
    type: path
    required: false
    filler: creator
    meaning: 回滚声明引用路径；可空。
    enum: null

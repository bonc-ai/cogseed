# Global exit-code registry — single semantic source for phase 1 & 2
registry_version: "1.0.0"
codes:
  0:
    semantic: SUCCESS
    phase1_results: [PASS, FROZEN, CONSISTENT, TEMPLATE_PROVIDED]
  10:
    semantic: SUCCESS_WITH_WARNINGS
    phase1_results: [PASS_WITH_WARNINGS, VERSION_DEPRECATED]
  11:
    semantic: INPUT_REQUIRED
    phase1_results: [NEEDS_INPUT, REQUIRED_FIELD_MISSING]
  12:
    semantic: NOT_READY
    phase1_results: [NOT_READY]
  20:
    semantic: VALIDATION_FAIL
    phase1_results: [FAIL]
  21:
    semantic: DERIVATION_FAILED
    phase1_results: [DERIVATION_FAILED]
  22:
    semantic: CONSISTENCY_FAILED
    phase1_results: [CONSISTENCY_FAILED]
  23:
    semantic: VERSION_UNSUPPORTED
    phase1_results: [VERSION_UNSUPPORTED]
  31:
    semantic: SECURITY_BLOCK
    phase1_results: [BLOCK]
  32:
    semantic: SUBJECT_MUTATED
    phase1_results: [SUBJECT_MUTATED]
  33:
    semantic: DIGEST_MISMATCH
    phase1_results: [DIGEST_MISMATCH, DIGEST_SET_MISMATCH]
  34:
    semantic: REPORT_SET_INCOMPLETE
    phase1_results: [REPORT_SET_INCOMPLETE]
  35:
    semantic: EXPIRED
    phase1_results: []
    phase2_only: true
  36:
    semantic: ATTESTATION_INVALID
    phase1_results: []
    phase2_only: true
  37:
    semantic: SIGNATURE_INVALID
    phase1_results: []
    phase2_only: true
  38:
    semantic: KEY_STATUS_INVALID
    phase1_results: []
    phase2_only: true
  39:
    semantic: GATE_DENIED
    phase1_results: []
    phase2_only: true
  40:
    semantic: EXECUTION_ERROR
    phase1_results: [EXECUTION_ERROR]

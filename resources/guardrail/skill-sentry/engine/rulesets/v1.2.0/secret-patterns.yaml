# ============================================================
# 密钥 / 凭据正则库 — v1.1.0
# ------------------------------------------------------------
# 用于 SR-01 密钥泄漏静态检测。扫描器内置同名默认规则，
# 本文件为可选覆盖入口（需 pyyaml）。
#
# v1.1.0 相对 v1.0.0：
#   · 修正 openai_api_key —— 旧 pattern 要求密钥中间出现 `T3BlbkFJ`
#     （"OpenAI" 的 base64 片段），只对 2023 年前的旧格式成立；
#     现行 sk-proj-* 密钥不含该片段，导致**真实密钥漏报**。
#   · 新增 24 个模式：数据库连接串、云厂商密钥、SaaS token、
#     私钥块的更多类型、CI 平台 token。
#   · 每条新增 confidence：`sk-...` 是确定性命中（high）；
#     「长随机串 + 赋值」是启发式（low），不应与确定性命中等价扣分。
# ============================================================
version: 1.1.0

secret_patterns:
  # ---- 模型厂商 ----
  - id: openai_api_key
    # 不再要求 T3BlbkFJ：现行 sk-proj-* / sk-svcacct-* 不含该片段。
    pattern: 'sk-(?:proj|svcacct|admin|None)-[A-Za-z0-9_\-]{20,}'
    severity: critical
    confidence: high
  - id: openai_legacy_key
    pattern: 'sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
    severity: critical
    confidence: high
  - id: anthropic_api_key
    pattern: 'sk-ant-(?:api03|admin01)-[A-Za-z0-9_\-]{20,}'
    severity: critical
    confidence: high
  - id: huggingface_token
    pattern: 'hf_[A-Za-z0-9]{34,}'
    severity: critical
    confidence: high
  - id: replicate_token
    pattern: 'r8_[A-Za-z0-9]{30,}'
    severity: high
    confidence: medium
  - id: groq_api_key
    pattern: 'gsk_[A-Za-z0-9]{40,}'
    severity: critical
    confidence: high
  - id: perplexity_api_key
    pattern: 'pplx-[A-Za-z0-9]{40,}'
    severity: critical
    confidence: high
  - id: cohere_api_key
    pattern: '\bcohere[_-]?api[_-]?key\s*[:=]\s*["'']?[A-Za-z0-9]{32,}'
    severity: high
    confidence: medium
  - id: xai_api_key
    pattern: 'xai-[A-Za-z0-9]{40,}'
    severity: critical
    confidence: high

  # ---- 云厂商 ----
  - id: aws_access_key
    pattern: '(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}'
    severity: critical
    confidence: high
  - id: aws_secret_access_key
    pattern: '(?:aws)?[_-]?secret[_-]?(?:access)?[_-]?key["'']?\s*[:=]\s*["'']?[A-Za-z0-9/+=]{40}'
    severity: critical
    confidence: high
  - id: aws_session_token
    pattern: 'FQoGZXIvYXdzE[A-Za-z0-9/+=]{100,}'
    severity: critical
    confidence: high
  - id: google_api_key
    pattern: 'AIza[0-9A-Za-z_\-]{35}'
    severity: critical
    confidence: high
  - id: google_sa_private_key
    pattern: '"private_key"\s*:\s*"-----BEGIN PRIVATE KEY-----'
    severity: critical
    confidence: high
  - id: google_oauth_client_secret
    pattern: 'GOCSPX-[A-Za-z0-9_\-]{28,}'
    severity: critical
    confidence: high
  - id: azure_storage_connection_string
    pattern: 'DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{40,}'
    severity: critical
    confidence: high
  - id: azure_client_secret
    pattern: '(?:AZURE_CLIENT_SECRET|client_secret)["'']?\s*[:=]\s*["'']?[A-Za-z0-9_\-\.~]{30,}'
    severity: high
    confidence: medium
  - id: aliyun_access_key
    pattern: 'LTAI[A-Za-z0-9]{12,20}'
    severity: high
    confidence: medium
  - id: tencent_secret_id
    pattern: 'AKID[A-Za-z0-9]{13,20}'
    severity: high
    confidence: medium
  - id: digitalocean_token
    pattern: 'dop_v1_[A-Za-z0-9]{64}'
    severity: critical
    confidence: high

  # ---- 私钥块 ----
  - id: private_key_block
    pattern: '-----BEGIN .*PRIVATE KEY-----'
    severity: critical
    confidence: high
  - id: ssh_private_key
    pattern: '-----BEGIN OPENSSH PRIVATE KEY-----'
    severity: critical
    confidence: high
  - id: pgp_private_key
    pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    severity: critical
    confidence: high
  - id: putty_private_key
    pattern: 'PuTTY-User-Key-File-[0-9]:'
    severity: critical
    confidence: high

  # ---- 代码托管 / CI ----
  - id: github_token
    pattern: 'gh(?:p|o|u|s|r)_[A-Za-z0-9_]{36,255}'
    severity: critical
    confidence: high
  - id: github_fine_grained_pat
    pattern: 'github_pat_[A-Za-z0-9_]{82,255}'
    severity: critical
    confidence: high
  - id: gitlab_token
    pattern: 'gl(?:pat|ptt|ft|rt|so|dt)-[A-Za-z0-9_\-]{20,}'
    severity: critical
    confidence: high
  - id: gitlab_pipeline_trigger
    pattern: 'glptt-[A-Za-z0-9_\-]{20,}'
    severity: critical
    confidence: high
  - id: bitbucket_app_password
    pattern: 'ATBB[A-Za-z0-9]{20,}'
    severity: high
    confidence: medium
  - id: circleci_token
    pattern: 'circleci[_-]?token["'']?\s*[:=]\s*["'']?[A-Za-z0-9]{40}'
    severity: high
    confidence: medium
  - id: jenkins_api_token
    pattern: 'jenkins[_-]?(?:api[_-]?)?token["'']?\s*[:=]\s*["'']?[A-Za-z0-9]{30,}'
    severity: high
    confidence: low
  - id: pypi_upload_token
    pattern: 'pypi-AgEIcHlwaS5vcmc[\w\-]{50,1000}'
    severity: critical
    confidence: high
  - id: npm_token
    pattern: 'npm_[A-Za-z0-9]{36}'
    severity: critical
    confidence: high

  # ---- SaaS / 通信 ----
  - id: slack_token
    pattern: 'xox(?:b|p|a|r|s)-[A-Za-z0-9\-]{20,}'
    severity: critical
    confidence: high
  - id: slack_webhook_url
    pattern: 'https://hooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{40,}'
    severity: critical
    confidence: high
  - id: stripe_secret_key
    pattern: '(?:sk|rk)_(?:test|live|prod)_[A-Za-z0-9]{10,99}'
    severity: critical
    confidence: high
  - id: stripe_restricted_key
    pattern: 'rk_(?:test|live)_[A-Za-z0-9]{10,99}'
    severity: critical
    confidence: high
  - id: sendgrid_api_token
    pattern: 'SG\.[A-Za-z0-9_\-\.]{66}'
    severity: critical
    confidence: high
  - id: mailgun_api_key
    pattern: 'key-[A-Za-z0-9]{32}'
    severity: high
    confidence: medium
  - id: mailchimp_api_key
    pattern: '[A-Za-z0-9]{32}-us[0-9]{1,2}'
    severity: high
    confidence: medium
  - id: twilio_api_key
    pattern: '\bSK[0-9a-fA-F]{32}\b'
    severity: medium
    confidence: low
  - id: discord_token
    # 三段式 legacy token 的形态与「a.b.c 形式的标识符」无法区分，
    # 因此降到 high/low：它仍是线索，但不足以单独拒装。
    pattern: '(?:mfa\.[A-Za-z0-9_\-]{20,}|[A-Za-z0-9_\-]{24}\.[A-Za-z0-9_\-]{6}\.[A-Za-z0-9_\-]{27,})'
    severity: high
    confidence: low
  - id: discord_webhook_url
    pattern: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_\-]{60,}'
    severity: critical
    confidence: high
  - id: telegram_bot_token
    pattern: '[0-9]{5,16}:[A-Za-z0-9_\-]{34}'
    severity: high
    confidence: medium
  - id: notion_integration_token
    pattern: '(?:ntn|secret)_[A-Za-z0-9]{40,}'
    severity: high
    confidence: medium
  - id: airtable_api_key
    pattern: '\bkey[A-Za-z0-9]{14}\b'
    severity: medium
    confidence: low
  - id: linear_api_key
    pattern: 'lin_api_[A-Za-z0-9]{40}'
    severity: high
    confidence: high
  - id: shopify_access_token
    pattern: 'shpat_[A-Za-z0-9]{32}'
    severity: critical
    confidence: high
  - id: square_access_token
    pattern: '(?:EAAA|sq0atp-|sq0csp-)[A-Za-z0-9_\-]{20,}'
    severity: medium
    confidence: low
  - id: datadog_api_key
    pattern: 'dd(?:api|app)[_-]?key["'']?\s*[:=]\s*["'']?[A-Za-z0-9]{32,40}'
    severity: high
    confidence: medium
  - id: sentry_dsn
    pattern: 'https://[0-9a-f]{32}@[a-z0-9.\-]*sentry[a-z0-9.\-]*/[0-9]+'
    severity: medium
    confidence: high
  - id: new_relic_license
    pattern: '[A-Za-z0-9]{40}NRAL'
    severity: high
    confidence: medium
  - id: algolia_admin_key
    pattern: '(?:ALGOLIA|algolia)[_-]?(?:ADMIN|admin)[_-]?KEY["'']?\s*[:=]\s*["'']?[A-Za-z0-9]{32}'
    severity: high
    confidence: medium
  - id: firebase_server_key
    pattern: 'AAAA[A-Za-z0-9_\-]{7}:[A-Za-z0-9_\-]{140}'
    severity: critical
    confidence: high
  - id: supabase_service_key
    # 与 jwt_token 同形；保留独立 id 只为在报告里区分来源语义。
    pattern: 'eyJ[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}'
    severity: low
    confidence: low
  - id: vercel_token
    pattern: 'vercel_[A-Za-z0-9_\-]{24,}'
    severity: high
    confidence: medium
  - id: vault_token
    pattern: '(?:hvs\.[A-Za-z0-9_\-]{90,120}|hvb\.[A-Za-z0-9_\-]{138,300})'
    severity: critical
    confidence: high
  - id: postman_api_key
    pattern: 'PMAK-[A-Za-z0-9]{24,}'
    severity: high
    confidence: high
  - id: doppler_token
    pattern: 'dp\.pt\.[A-Za-z0-9]{40,}'
    severity: high
    confidence: high

  # ---- 数据库连接串（含明文口令）----
  - id: postgres_uri_with_password
    pattern: 'postgres(?:ql)?://[^:@/\s]+:[^@/\s]{4,}@[^\s/]+'
    severity: critical
    confidence: high
  - id: mysql_uri_with_password
    pattern: 'mysql://[^:@/\s]+:[^@/\s]{4,}@[^\s/]+'
    severity: critical
    confidence: high
  - id: mongodb_uri_with_password
    pattern: 'mongodb(?:\+srv)?://[^:@/\s]+:[^@/\s]{4,}@[^\s/]+'
    severity: critical
    confidence: high
  - id: redis_uri_with_password
    pattern: 'redis://[^:@/\s]*:[^@/\s]{4,}@[^\s/]+'
    severity: critical
    confidence: high
  - id: amqp_uri_with_password
    pattern: 'amqps?://[^:@/\s]+:[^@/\s]{4,}@[^\s/]+'
    severity: high
    confidence: medium
  - id: basic_auth_in_url
    pattern: 'https?://[A-Za-z0-9._%\-]+:[^@/\s]{6,}@[A-Za-z0-9.\-]+'
    severity: high
    confidence: medium

  # ---- 通用启发式 ----
  - id: jwt_token
    pattern: 'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'
    severity: high
    confidence: medium
  - id: generic_env_api_key
    pattern: '(OPENAI_API_KEY|ANTHROPIC_API_KEY|API_KEY|SECRET_KEY|TOKEN)\s*=\s*[''"]?[A-Za-z0-9_\-]{16,}'
    severity: high
    confidence: medium
  - id: bearer_authorization_header
    pattern: 'Authorization:\s*Bearer\s+[A-Za-z0-9_\-\.=]{20,}'
    severity: high
    confidence: medium
  - id: private_key_inline_escaped
    # JSON/YAML 里被转义的私钥头：`"-----BEGIN RSA PRIVATE KEY-----\n"`
    pattern: 'BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY\\n'
    severity: critical
    confidence: high
  - id: high_entropy_assignment
    # 长随机串直接赋给可疑变量名。低置信度：base64 资源、哈希常量、
    # 测试夹具都会命中。它只作为线索，几乎不参与扣分。
    pattern: '(?:secret|token|password|passwd|apikey|api_key|access_key|private_key)\w*\s*[:=]\s*["''][A-Za-z0-9+/=_\-]{32,}["'']'
    severity: low
    confidence: low

# 误报抑制：命中这些上下文标记的行不计入密钥泄漏（示例/占位符/文档）
false_positive_markers:
  - example
  - sample
  - placeholder
  - 示例
  - your-key-here
  - xxxxxxxx
  - "<your"
  - dummy
  - redacted
  - changeme
  - "<redacted"
  - "{{"
  - "${"
  - "%s"
  - "os.environ"
  - "process.env"
  - "getenv"

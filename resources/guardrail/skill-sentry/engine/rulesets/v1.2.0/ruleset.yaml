# ruleset.yaml — 规则包索引（v1.2.0）
#
# 声明该版本规则包包含哪些文件及其职责，供 rule_loader.py 追溯
# rules_source，也供人工审查规则演进历史。

version: "1.2.0"
status: current
released: "2026-10-19"

files:
  text-rules.yaml:
    purpose: "12 类文本规则组（与 v1.1.0 相同）：危险命令 / 动态执行 / SQL注入 /
              持久化 / 提示注入 / 网络外联 / 可疑地址 / 反向shell / 凭据读取 /
              监控行为 / 挖矿 / 不可信输入执行"
  secret-patterns.yaml:
    purpose: "密钥/凭据检测正则模式（含数据库连接串与云厂商密钥）+ 误报标记词表（与 v1.1.0 相同）"
  vulnerabilities.jsonl:
    purpose: "依赖漏洞快照：一行元数据 + 一行一条 OSV 公告（npm / PyPI）。
              由 tools/refresh_vulnerability_db.py 生成；scanner_core/vulnerability.py 消费"
  yara/:
    purpose: "YARA 子集签名包（49 条）：WebShell / 反向 shell / 挖矿 / 凭据窃取 /
              持久化 / 勒索与破坏 / 混淆执行 / 监控。由 scanner_core/yara_lite.py 解析"

compatible_engine_versions: ">=2.3.0"

changelog:
  - version: "1.2.0"
    date: "2026-10-19"
    change: >
      新增内置依赖漏洞快照与 YARA 签名包。依赖漏洞扫描从「仅 osv-scanner」
      改为原生实现（npm/PyPI 清单与锁文件解析 + OSV 快照区间匹配，osv-scanner
      仍作为可选增强）；恶意特征匹配从手写指标表改为 YARA 子集引擎 + 签名包。
      文本规则与密钥模式未变更，rule_count 仍为 181。
  - version: "1.1.0"
    date: "2026-03-06"
    change: >
      新增 5 个规则组，原有 7 组各补充规则；每条规则新增 confidence 字段；
      forbidden_files 从 12 项扩展到 22 项；新增 covert_credential_harvest
      一票否决项；修正 openai_api_key 旧格式导致的真实密钥漏报。
  - version: "1.0.0"
    date: "2026-07-27"
    change: "从 cogseed-security-scan 02_rules 迁移，规则内容未变更，仅补充版本化索引"

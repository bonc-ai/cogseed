# version-policy.yaml — 规则包版本兼容性声明
#
# 对标 security-skills 的 version-policy 设计：明确当前/受支持/废弃/
# 不支持的规则包版本，以及与引擎版本的兼容矩阵，避免规则和引擎版本
# 隐式耦合导致的“规则改了但引擎没跟上”问题。

current: "v1.0.0"

supported:
  - version: "v1.0.0"
    status: current
    min_engine_version: "2.0.0"

deprecated: []

unsupported: []

policy: |
  引擎加载规则包时按精确版本匹配 rulesets/<version>/ruleset.yaml。
  版本不在 supported 列表中时，rule_loader.load_rules() 记录警告并
  降级为 builtin 默认规则（不中断扫描，但 rules_source 字段会明确
  标注降级原因），保证扫描器在规则包缺失/损坏时仍可用（fail-open
  于扫描能力，但报告中会明确降级标注，供人工判断是否可信）。

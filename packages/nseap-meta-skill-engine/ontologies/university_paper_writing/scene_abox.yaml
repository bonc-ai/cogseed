---
# ============================================================
# 大学生写论文本体 — ABox（实例层）
# 版本: v1.0.0
# 描述: 论文写作领域的实例、示例和 fewshot 数据
# 适用: Agent 的推理参考和 Meta-Skill Engine 的归因学习
# ============================================================

schema_version: "1.0.0"
profile: scene_abox/1.0

tbox_ref:
  ontology_id: university_paper_writing
  ontology_version: "1.0.0"
  file: scene_tbox.yaml

rbox_ref:
  ontology_id: university_paper_writing
  ontology_version: "1.0.0"
  file: scene_rbox.yaml

status: "success"

# ============================================================
# 案例示例（Case Examples / Fewshots）
# ============================================================

abox:
  case_examples:
    # ======================================================
    # 论文类型实例（正例）
    # ======================================================
    - id: PAPER_EX_01
      type: positive_fewshot
      name: 课程论文示例
      user_query: "我需要写一篇3000字的课程论文，主题是人工智能伦理"
      expected_understanding: "学生需要撰写课程作业性质的学术论文，3000字左右，讨论人工智能伦理问题"
      expected_query_plan:
        - 确定具体研究角度（如算法偏见、隐私保护、就业影响）
        - 选择合适的研究方法（文献综述/案例分析）
        - 规划论文结构（引言→文献→分析→结论）
      expected_behavior:
        status: eligible_for_guidance
        explanation: "课程论文，3000字，属于正常范围"
        referenced_rbox_rules: [R_STRUCT_04, R_STRUCT_05]
      evidence: "常见课程论文要求"
      confidence: 0.95

    - id: PAPER_EX_02
      type: positive_fewshot
      name: 本科毕业论文示例
      user_query: "我正在写本科毕业论文，题目是基于深度学习的图像识别系统，目前写了5000字"
      expected_understanding: "学生正在撰写本科毕业论文，工科方向，目前字数不足"
      expected_query_plan:
        - 检查当前字数与要求的差距（需≥8000字）
        - 建议补充实验/实现/分析部分
        - 提醒查重率要求
      expected_behavior:
        status: needs_improvement
        explanation: "本科毕业论文要求至少8000字，当前5000字不足"
        referenced_rbox_rules: [R_STRUCT_01, R_STRUCT_06]
      evidence: "本科毕业论文字数要求"
      confidence: 0.95

    - id: PAPER_EX_03
      type: positive_fewshot
      name: 硕士论文示例
      user_query: "我的硕士论文开题报告被导师打回来了，说文献综述部分太薄"
      expected_understanding: "硕士论文开题阶段，文献综述部分需要加强"
      expected_query_plan:
        - 建议增加文献检索范围（≥30篇参考文献）
        - 建议按主题/时间/方法论组织文献
        - 建议增加批判性评价而非简单罗列
      expected_behavior:
        status: eligible_for_guidance
        explanation: "硕士论文文献综述需要系统性和批判性"
        referenced_rbox_rules: [R_STRUCT_06, R_STRUCT_09]
      evidence: "硕士论文文献综述要求"
      confidence: 0.90

    - id: PAPER_EX_04
      type: positive_fewshot
      name: 博士论文示例
      user_query: "我的博士论文第三章方法论部分，导师说描述不够详细"
      expected_understanding: "博士论文方法论部分需要更详细的描述"
      expected_query_plan:
        - 建议补充研究设计详细描述
        - 建议补充样本选择和纳入/排除标准
        - 建议补充数据收集和分析的具体步骤
      expected_behavior:
        status: needs_improvement
        explanation: "博士论文方法论需详细到可重复"
        referenced_rbox_rules: [R_METHOD_01, R_METHOD_04]
      evidence: "博士论文方法论要求"
      confidence: 0.90

    - id: PAPER_EX_05
      type: positive_fewshot
      name: 期刊论文示例
      user_query: "我要投稿到《计算机学报》，需要按什么格式写参考文献"
      expected_understanding: "用户需要中文核心期刊的参考文献格式"
      expected_query_plan:
        - 确认期刊要求的引用格式（GB/T 7714）
        - 提供期刊特定的模板和范例
        - 提醒查重率要求（通常<15%）
      expected_behavior:
        status: eligible_for_guidance
        explanation: "中文核心期刊通常使用 GB/T 7714 格式"
        referenced_rbox_rules: [R_CITE_01, R_CITE_02]
      evidence: "《计算机学报》投稿须知"
      confidence: 0.90

    - id: PAPER_EX_06
      type: positive_fewshot
      name: 文献综述论文示例
      user_query: "我想写一篇关于近五年国内在线教育研究的文献综述"
      expected_understanding: "用户要撰写文献综述性质的论文"
      expected_query_plan:
        - 建议确定检索策略和数据库
        - 建议按主题或时间组织文献
        - 建议指出研究空白和未来方向
      expected_behavior:
        status: eligible_for_guidance
        explanation: "文献综述需要系统性检索和批判性评价"
        referenced_rbox_rules: [R_STRUCT_06, R_STRUCT_09]
      evidence: "文献综述写作规范"
      confidence: 0.90

    # ======================================================
    # 摘要写作示例（正例/反例）
    # ======================================================
    - id: ABSTRACT_GOOD_01
      type: positive_fewshot
      name: 优秀摘要示例
      user_query: "请帮我看看我的摘要写得怎么样"
      expected_understanding: "用户需要摘要质量评估"
      expected_query_plan:
        - 检查是否包含背景、方法、结果、结论四要素
        - 检查字数是否在 200-300 字
        - 检查是否有关键词
      expected_behavior:
        status: good_example
        explanation: "优秀摘要应包含四要素，200-300字，结构清晰"
        referenced_rbox_rules: [R_STRUCT_04, R_STRUCT_07]
      evidence: |
        "随着人工智能技术的快速发展，算法偏见问题日益受到关注。
        本研究采用案例分析方法，对推荐系统中的算法偏见进行了深入探讨。
        研究发现，推荐系统存在信息茧房和歧视性推送两大问题。
        最后提出了算法透明度和多元化推荐等解决策略。"
      confidence: 0.95

    - id: ABSTRACT_BAD_01
      type: negative_fewshot
      name: 摘要缺少方法和结果
      user_query: "我的摘要只写了研究背景和意义"
      expected_understanding: "摘要缺少方法和结果要素"
      expected_query_plan:
        - 指出缺少方法和结果
        - 建议补充研究方法和主要发现
      expected_behavior:
        status: needs_improvement
        explanation: "摘要必须包含背景、方法、结果、结论四要素"
        referenced_rbox_rules: [R_STRUCT_04]
      evidence: "不完整摘要示例：'人工智能是当今最热门的技术之一...'"
      confidence: 0.95

    - id: ABSTRACT_BAD_02
      type: negative_fewshot
      name: 摘要过长
      user_query: "我的摘要写了 400 个字"
      expected_understanding: "摘要超过字数限制"
      expected_query_plan:
        - 指出摘要过长
        - 建议精简到 200-300 字
      expected_behavior:
        status: needs_improvement
        explanation: "中文摘要应控制在 200-300 字"
        referenced_rbox_rules: [R_STRUCT_07]
      evidence: "摘要字数超标"
      confidence: 0.95

    # ======================================================
    # 引言写作示例（正例/反例）
    # ======================================================
    - id: INTRO_GOOD_01
      type: positive_fewshot
      name: 优秀引言示例
      user_query: "我的引言怎么开头比较好"
      expected_understanding: "用户需要引言写作指导"
      expected_query_plan:
        - 建议从社会问题/研究背景切入
        - 建议逐步缩小到具体研究问题
        - 建议最后陈述研究目的和论点
      expected_behavior:
        status: good_example
        explanation: "优秀引言应从问题出发，逐步缩小到研究问题"
        referenced_rbox_rules: [R_IMRAD_01, R_STRUCT_09]
      evidence: |
        "随着互联网普及，网络谣言传播速度加快（背景）。
        现有研究多关注谣言检测，但对辟谣机制研究不足（研究空白）。
        本文旨在探讨辟谣信息的传播机制和效果（研究目的）。"
      confidence: 0.90

    - id: INTRO_BAD_01
      type: negative_fewshot
      name: 引言过于宽泛
      user_query: "我的引言开头是'自从人类文明以来...'"
      expected_understanding: "引言开头过于宽泛，与主题脱节"
      expected_query_plan:
        - 指出开头过于宽泛
        - 建议直接切入研究主题
      expected_behavior:
        status: needs_improvement
        explanation: "引言应直接相关研究主题，避免'人类黎明'式开头"
        referenced_rbox_rules: [R_IMRAD_01]
      evidence: "无效引言示例：'自从人类文明以来，信息传播就...'"
      confidence: 0.90

    - id: INTRO_BAD_02
      type: negative_fewshot
      name: 引言仅重复标题
      user_query: "我的引言就是重复了论文题目"
      expected_understanding: "引言没有提供任何引导信息"
      expected_query_plan:
        - 指出引言需要提供背景、问题和目的
        - 建议扩展为完整的引言结构
      expected_behavior:
        status: needs_improvement
        explanation: "引言需要提供背景、问题和目的，不能仅重复标题"
        referenced_rbox_rules: [R_IMRAD_01]
      evidence: "无效引言示例：'本文研究了XX问题。'"
      confidence: 0.95

    # ======================================================
    # 结论写作示例（正例/反例）
    # ======================================================
    - id: CONCL_GOOD_01
      type: positive_fewshot
      name: 优秀结论示例
      user_query: "结论部分应该写什么"
      expected_understanding: "用户需要结论写作指导"
      expected_query_plan:
        - 建议总结主要发现
        - 建议指出研究局限
        - 建议提出未来研究方向
      expected_behavior:
        status: good_example
        explanation: "优秀结论应综合论点、指出局限、提出未来方向"
        referenced_rbox_rules: [R_IMRAD_05, R_STRUCT_10]
      evidence: |
        "本文通过实证分析发现，XX因素对YY有显著影响（总结）。
        但本研究样本量有限，未来可扩大范围（局限）。
        后续研究可探讨ZZ因素的调节作用（展望）。"
      confidence: 0.90

    - id: CONCL_BAD_01
      type: negative_fewshot
      name: 结论仅重复摘要
      user_query: "我的结论就是把摘要换了个说法"
      expected_understanding: "结论没有推进思考"
      expected_query_plan:
        - 指出结论需要综合而非重复
        - 建议加入局限性和未来方向
      expected_behavior:
        status: needs_improvement
        explanation: "结论应综合各论点，展示如何相互关联，而非重复摘要"
        referenced_rbox_rules: [R_IMRAD_05]
      evidence: "无效结论示例：'总之，本文研究了...'（仅重复摘要）"
      confidence: 0.90

    # ======================================================
    # 引用规范示例（正例/反例）
    # ======================================================
    - id: CITE_APA_CORRECT
      type: positive_fewshot
      name: APA 引用正确格式
      user_query: "APA格式怎么写文内引用"
      expected_understanding: "用户需要 APA 引用格式指导"
      expected_query_plan:
        - 提供 APA 作者-日期制格式
        - 提供直接引用和间接引用的区别
      expected_behavior:
        status: good_example
        explanation: "APA 格式：(Smith, 2020) 或 (Smith, 2020, p. 15)"
        referenced_rbox_rules: [R_CITE_01]
      evidence: "正确示例：(Smith, 2020) 或 (Smith, 2020, p. 15)"
      confidence: 0.95

    - id: CITE_APA_WRONG
      type: negative_fewshot
      name: APA 引用错误格式
      user_query: "我写了 (Smith, 2020, 第15页)"
      expected_understanding: "APA 格式中不应使用中文"
      expected_query_plan:
        - 指出不应在 APA 中使用中文"第...页"
        - 建议改为 p. 15 或 pp. 15-18
      expected_behavior:
        status: needs_improvement
        explanation: "APA 格式应使用 p./pp. 而非中文"
        referenced_rbox_rules: [R_CITE_01]
      evidence: "错误示例：(Smith, 2020, 第15页)"
      confidence: 0.95

    - id: CITE_MIXED
      type: negative_fewshot
      name: 混合引用格式
      user_query: "我的论文里既有 (Smith, 2020) 又有 [1]"
      expected_understanding: "论文中混用了不同引用格式"
      expected_query_plan:
        - 指出格式不一致
        - 建议统一为一种格式
      expected_behavior:
        status: needs_improvement
        explanation: "同一论文必须使用统一的引用格式"
        referenced_rbox_rules: [R_CITE_01]
      evidence: "错误示例：文中同时出现 (Smith, 2020) 和 [1]"
      confidence: 0.95

    # ======================================================
    # 学术诚信示例（正例/反例）
    # ======================================================
    - id: ETHICS_GOOD_01
      type: positive_fewshot
      name: 正确引用避免抄袭
      user_query: "我引用了别人的观点，怎么避免被算抄袭"
      expected_understanding: "用户需要正确引用的方法"
      expected_query_plan:
        - 建议直接引用加引号并标注来源
        - 建议改写并标注来源
        - 建议控制引用比例
      expected_behavior:
        status: good_example
        explanation: "正确引用需标注来源，直接引用加引号，改写也需标注"
        referenced_rbox_rules: [R_ETHICS_01, R_CITE_02]
      evidence: "正确引用示例：'XXX'（Smith, 2020, p. 15）"
      confidence: 0.95

    - id: ETHICS_BAD_01
      type: negative_fewshot
      name: 查重率过高
      user_query: "我的论文查重率是 35%"
      expected_understanding: "论文查重率严重超标"
      expected_query_plan:
        - 指出查重率过高
        - 建议大幅修改降重
        - 建议增加原创内容
      expected_behavior:
        status: needs_improvement
        explanation: "查重率必须 ≤20%，35% 需大幅修改"
        referenced_rbox_rules: [R_ETHICS_01, R_ETHICS_02]
      evidence: "查重率 35% 超过 20% 限制"
      confidence: 0.95

    # ======================================================
    # 推理练习（Reasoning Drills）
    # ======================================================
    - id: REASONING_01
      type: reasoning_drill
      name: 研究方法选择推理
      user_query: "我想研究大学生手机依赖与学业成绩的关系，用什么研究方法"
      expected_understanding: "用户需要选择合适的研究方法研究因果关系"
      expected_query_plan:
        - 分析研究问题类型（因果关系）
        - 推荐定量研究方法（问卷调查+相关性分析）
        - 建议控制变量（年级、专业等）
      expected_behavior:
        status: eligible_for_guidance
        explanation: "因果关系研究推荐定量方法，需控制混淆变量"
        referenced_rbox_rules: [R_METHOD_02, R_METHOD_03]
      confidence: 0.85

    - id: REASONING_02
      type: reasoning_drill
      name: 论文类型判断推理
      user_query: "我是一名大三学生，要写一篇 5000 字的论文"
      expected_understanding: "用户可能是课程论文或本科毕业论文"
      expected_query_plan:
        - 询问是课程论文还是毕业论文
        - 根据类型给出不同建议
      expected_behavior:
        status: needs_clarification
        explanation: "5000字可能是课程论文或毕业论文中期，需确认"
        referenced_rbox_rules: [R_STRUCT_01]
      confidence: 0.80

    # ======================================================
    # 澄清示例（Clarification Examples）
    # ======================================================
    - id: CLARIFY_01
      type: clarification_example
      name: 意图模糊需澄清
      user_query: "我要写论文"
      expected_understanding: "用户意图过于模糊，需要澄清"
      expected_query_plan:
        - 询问论文类型（课程/本科/硕士/博士）
        - 询问学科领域
        - 询问具体需求（选题/结构/写作/查重）
      expected_behavior:
        status: needs_clarification
        explanation: "意图模糊，需澄清论文类型、学科和具体需求"
        referenced_rbox_rules: []
      confidence: 0.90

  # ============================================================
  # 实例事实（Instance Facts）
  # ============================================================

  instance_facts:
    individuals:
      - individual_id: PERSON_01
        class: Person
        assertions:
          - property: name
            value: "张教授"
          - property: role
            value: "导师"
      - individual_id: PERSON_02
        class: Person
        assertions:
          - property: name
            value: "李同学"
          - property: role
            value: "本科毕业生"
      - individual_id: INSTITUTION_01
        class: Institution
        assertions:
          - property: name
            value: "XX大学计算机学院"
          - property: type
            value: "本科院校"
      - individual_id: PAPER_01
        class: BachelorThesis
        assertions:
          - property: title
            value: "基于深度学习的图像识别系统设计与实现"
          - property: wordCount
            value: "12000"
          - property: citationStyle
            value: "GB-T7714"
      - individual_id: PAPER_02
        class: MasterThesis
        assertions:
          - property: title
            value: "面向教育大数据的学习行为分析模型研究"
          - property: wordCount
            value: "35000"
          - property: citationStyle
            value: "APA"
    datatype_assertions: []
    object_assertions:
      - individual_id: PAPER_01
        relation: hasAuthor
        target_individual_id: PERSON_02
      - individual_id: PAPER_01
        relation: supervisedBy
        target_individual_id: PERSON_01
      - individual_id: PERSON_02
        relation: affiliatedWith
        target_individual_id: INSTITUTION_01

# ============================================================
# 验证结果（Validation Results）
# ============================================================

validation_results: []

# ============================================================
# RBox 候选说明（RBox Candidate Notes）
# ============================================================

rbox_candidate_notes:
  - "需要补充不同学校/学科的差异化规则"
  - "需要补充论文答辩阶段的规则"
  - "需要补充开题报告阶段的规则"


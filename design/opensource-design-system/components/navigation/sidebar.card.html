<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧边栏导航 · CogSeed</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../vendor/react.production.min.js"></script><script src="../../vendor/react-dom.production.min.js"></script><script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--cs-canvas);color:var(--cs-ink);font-family:var(--cs-font-sans)}
main{padding:var(--cs-space-6);margin:auto}h1{font-size:18px;font-weight:500;margin:0 0 var(--cs-space-6)}
.specimen-toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--cs-space-4);width:calc(var(--cs-sidebar-width) + 2px);margin-bottom:var(--cs-space-4);font-size:13px}

.stage.is-collapsed{height:auto}.collapsed-controls{height:var(--cs-titlebar-height);display:flex;align-items:center;padding:0 var(--cs-space-4);background:var(--cs-sidebar-top)}
.notice{padding-top:var(--cs-space-3);color:var(--cs-text-muted);font-size:13px}

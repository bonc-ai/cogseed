<!-- @dsCard group="Type" viewport="700x210" name="Sans · 问候与标题" subtitle="系统非衬线 400 — display 34 / heading 22 / dialog 18" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sans</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:var(--cs-space-3)">
<div style="display:flex;align-items:baseline;gap:var(--cs-space-4)"><span class="h" style="width:110px">display 34/40</span><span style="font:400 34px/1.25 var(--cs-font-sans);letter-spacing:-.015em">下午好，陈昱</span></div>
<div style="display:flex;align-items:baseline;gap:var(--cs-space-4)"><span class="h" style="width:110px">heading 22</span><span style="font:400 22px/1.3 var(--cs-font-sans)">月度进展简报</span></div>
<div style="display:flex;align-items:baseline;gap:var(--cs-space-4)"><span class="h" style="width:110px">dialog 18</span><span style="font:400 18px/1.35 var(--cs-font-sans)">删除任务与全部产物？</span></div>
<div class="u">全界面统一使用系统默认非衬线；通过字号建立层级，display 全局最多出现一次。</div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x190" name="状态 · 三色" subtitle="只用于表达状态，永不用于强调或装饰" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>状态</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p g" style="grid-template-columns:repeat(3,1fr)">
<div><div class="sw" style="background:#1E6E4E"></div><div class="n">success</div><div class="h">#1E6E4E · 文字 #1B5B41 · 底 #E8F1EC</div><div class="u">已完成、已连接、数据不出域</div></div>
<div><div class="sw" style="background:#B5761F"></div><div class="n">attention</div><div class="h">#B5761F · 文字 #8A5A14 · 底 #FBF1E2</div><div class="u">运行中、待确认、单次授权</div></div>
<div><div class="sw" style="background:#A33A2B"></div><div class="n">critical</div><div class="h">#A33A2B · 底 #F8EBE8</div><div class="u">失败、越权、破坏性操作（频率极低）</div></div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x190" name="中性 · 面" subtitle="工作区、侧栏、文档台面与选中底" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>中性 · 面</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p g" style="grid-template-columns:repeat(6,1fr)">
<div><div class="sw" style="background:#FFFFFF"></div><div class="n">surface-card</div><div class="h">#FFFFFF</div><div class="u">主工作区、卡片、输入框</div></div>
<div><div class="sw" style="background:#FBFDFC"></div><div class="n">canvas</div><div class="h">#FBFDFC</div><div class="u">规范页 / 次级页面底</div></div>
<div><div class="sw" style="background:var(--cs-sidebar-top)"></div><div class="n">sidebar</div><div class="h">#F4F8F5</div><div class="u">侧栏（纯色）</div></div>
<div><div class="sw" style="background:#EDF3EF"></div><div class="n">surface-doc</div><div class="h">#EDF3EF</div><div class="u">文档预览台面</div></div>
<div><div class="sw" style="background:#F7FAF8"></div><div class="n">surface-subtle</div><div class="h">#F7FAF8</div><div class="u">表头、次级栏</div></div>
<div><div class="sw" style="background:rgba(14,159,110,.09)"></div><div class="n">selected-wash</div><div class="h">accent 9%</div><div class="u">侧栏与列表选中态</div></div>
</div></body></html>

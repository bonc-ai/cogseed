<!-- @dsCard group="Spacing" viewport="700x150" name="交互态规则" subtitle="hover / 焦点 / 选中 / 禁用的统一表达" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>交互态</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p g" style="grid-template-columns:repeat(4,1fr);gap:var(--cs-space-4)">
<div><div class="lbl">hover</div><div class="u" style="margin-top:var(--cs-space-2)">中性 <b>ink 4.5–6%</b> 底；次按钮描边加深至 .22；主按钮 brightness(1.06)。永不用品牌色 hover。</div></div>
<div><div class="lbl">焦点</div><div class="u" style="margin-top:var(--cs-space-2)">动作控件用 <b>accent 描边与外环</b>；输入区域用中性灰边线，不加蓝框。强制颜色模式保留系统提示。</div></div>
<div><div class="lbl">选中</div><div class="u" style="margin-top:var(--cs-space-2)">仅 <b>accent 9% 淡底</b> + 略深文字，普通导航字重 400，标题与页签可用 500；不用左侧色条、不用阴影。</div></div>
<div><div class="lbl">禁用</div><div class="u" style="margin-top:var(--cs-space-2)">底 <b>ink 8%</b>、文字 ink-32、cursor not-allowed；无权限项保留可见但置灰。</div></div>
</div></body></html>

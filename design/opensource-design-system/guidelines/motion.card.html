<!-- @dsCard group="Spacing" viewport="700x200" name="动效时长" subtitle="全局同时最多一个动效焦点；禁止弹跳、缩放入场、渐变流光" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>动效</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p" style="display:flex;gap:var(--cs-space-6)">
<div style="font:400 var(--cs-size-ui-sm)/1.95 var(--cs-font-sans);color:var(--cs-ink-60)">
hover / 状态色　　120ms ease-out<br>开关 / 发送键　　140ms ease-out<br>视图切换淡入　　160ms + 4px 上移<br>面板展开收起　　200ms cubic-bezier(.2,.8,.2,1)
</div>
<div style="width:1px;background:var(--cs-border-hairline)"></div>
<div style="font:400 var(--cs-size-ui-sm)/1.95 var(--cs-font-sans);color:var(--cs-ink-60)">
进度条宽度　　　400ms cubic-bezier(.2,.8,.2,1)<br>转圈指示器　　　900ms linear（当前步骤 1.1s）<br>骨架屏呼吸　　　1.4s ease-in-out<br>流式文本　　　　逐字，无光标跳动
</div></div></body></html>

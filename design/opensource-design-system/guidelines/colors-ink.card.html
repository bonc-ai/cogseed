<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>中性 · 墨</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p g" style="grid-template-columns:repeat(7,1fr)">
<div><div class="sw" style="background:#14281E"></div><div class="n">ink</div><div class="h">#14281E</div><div class="u">主文字、主按钮</div></div>

<div><div class="sw" style="background:#3E5A4C"></div><div class="n">ink-70</div><div class="h">#3E5A4C</div><div class="u">导航项、次要按钮</div></div>
<div><div class="sw" style="background:#4C685A"></div><div class="n">ink-60</div><div class="h">#4C685A</div><div class="u">列表次级文字</div></div>
<div><div class="sw" style="background:#587363"></div><div class="n">ink-55</div><div class="h">#587363</div><div class="u">卡片说明段</div></div>
<div><div class="sw" style="background:#5E7467"></div><div class="n">ink-45</div><div class="h">#5E7467</div><div class="u">说明、图标默认</div></div>
<div><div class="sw" style="background:#9CAEA2"></div><div class="n">ink-32</div><div class="h">#9CAEA2</div><div class="u">仅禁用状态</div></div>
</div></body></html>

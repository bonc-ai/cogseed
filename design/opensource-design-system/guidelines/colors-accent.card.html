<!-- @dsCard group="Colors" viewport="700x210" name="强调 · 开源绿" subtitle="低饱和、限量出现：发送键 · 头像 · 选中态 · 渐变雾" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>强调</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cs-canvas);font-family:var(--cs-font-sans);color:var(--cs-ink)}.p{padding:var(--cs-space-4) var(--cs-space-4);box-sizing:border-box}.g{display:grid;gap:var(--cs-space-3)}.sw{height:56px;border-radius:var(--cs-radius-md);border:1px solid var(--cs-border-field)}.n{margin-top:var(--cs-space-2);font-size:var(--cs-size-ui-sm);font-weight:500}.h{font:400 var(--cs-size-meta) var(--cs-font-sans);color:var(--cs-ink-45)}.u{margin-top:var(--cs-space-1);font-size:var(--cs-size-caption);color:var(--cs-ink-45)}.row{display:flex;flex-wrap:wrap;gap:var(--cs-space-3);align-items:center}.lbl{font:var(--cs-type-label);letter-spacing:var(--cs-tracking-label);text-transform:uppercase;color:var(--cs-text-placeholder)}</style></head><body><div class="p g" style="grid-template-columns:repeat(4,1fr)">
<div><div class="sw" style="background:#0A7A55"></div><div class="n">accent</div><div class="h">#0A7A55</div><div class="u">发送键、头像、进行中任务点</div></div>
<div><div class="sw" style="background:linear-gradient(135deg,#0A7A55,#086545)"></div><div class="n">accent-grad</div><div class="h">135°</div><div class="u">32px 发送键、26px 头像与主要操作；白字对比度至少 4.5:1</div></div>
<div><div class="sw" style="background:rgba(14,159,110,.09)"></div><div class="n">accent-wash</div><div class="h">9%</div><div class="u">选中态唯一表达；hover 仍用中性</div></div>
<div><div class="sw" style="background:radial-gradient(220px 140px at 88% -20%,rgba(14,159,110,.28) 0%,rgba(14,159,110,0) 70%),radial-gradient(180px 130px at 8% 0%,rgba(66,184,130,.2) 0%,rgba(66,184,130,0) 72%),#fff"></div><div class="n">mist</div><div class="h">渐变雾</div><div class="u">纯白主区右上最亮，向下化开</div></div>
</div></body></html>
